<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Top-3 Dashboard</title>
<style>
:root{--bg:#0a111d;--bg2:#0f1828;--card:#142034;--card2:#1a2a43;--line:#25365a;--ink:#eef3fb;--mute:#8fa1bf;--acc:#2f80ff;--acc2:#1b5fd1;--gold:#ffc83d;--good:#20c27a;--bad:#ff5b5b;--btn:#1d2f4f;--btnh:#27406a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
/* header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#12306b,#0e2452);border-bottom:3px solid var(--gold)}
.hw{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px}.brand b{color:var(--gold)}
nav{display:flex;gap:2px;overflow-x:auto}nav button{background:none;border:0;color:#b8c9ea;padding:8px 12px;border-radius:6px;font-weight:600;white-space:nowrap}
nav button.on{background:rgba(255,255,255,.14);color:#fff}
.who{margin-left:auto;font-size:12.5px;color:#b8c9ea}.who button{background:none;border:0;color:var(--gold);padding:0 2px}
/* layout */
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 90px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.wrap.nos{grid-template-columns:minmax(0,1fr)}
@media(max-width:960px){.wrap{grid-template-columns:minmax(0,1fr)}}
.mute{color:var(--mute);font-size:13px}.good{color:var(--good)}.bad{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px}h3{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
/* toolbar */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input{flex:1 1 180px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 12px;font:inherit}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;color:var(--mute)}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.day{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:14px 2px 6px}
/* game row */
.game{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.gh{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.gh:hover{background:var(--card2)}
.tm{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 0}.tm.r{justify-content:flex-end;text-align:right}
.tm img{width:34px;height:34px;object-fit:contain;flex:none}.tm b{font-size:15px;line-height:1.1}.tm small{display:block;color:var(--mute);font-size:11.5px;font-weight:400}
.mid{text-align:center;flex:none;min-width:70px}.mid .t{font-weight:700;font-size:13px}.mid .s{font-size:11px;color:var(--mute)}
.chev{flex:none;color:var(--mute);transition:transform .15s}.game.open .chev{transform:rotate(180deg)}
.av{display:flex;margin-left:6px}.av .ph{margin-left:-8px;border:2px solid var(--card)}
.ph{position:relative;display:inline-block;width:30px;height:30px;border-radius:50%;background:var(--btn);overflow:hidden;flex:none;vertical-align:middle}
.ph::before{content:attr(data-i);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--mute)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.gb{display:none;border-top:1px solid var(--line);padding:6px 12px 12px;background:var(--bg2)}.game.open .gb{display:block}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}@media(max-width:760px){.cols{grid-template-columns:1fr}.av{display:none}.tm img{width:28px;height:28px}}
.th{display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-weight:700}.th img{width:22px;height:22px}.th span{font-weight:400;color:var(--mute);font-size:12px}
/* player */
.pl{padding:10px 0;border-bottom:1px solid var(--line)}.pl:last-child{border:0}
.ph.l{width:48px;height:48px}.ph.l::before{font-size:14px}
.pt{display:flex;gap:10px;align-items:center}.pn{font-weight:700;cursor:pointer}.pn:hover{text-decoration:underline}
.chip{display:inline-block;border-radius:4px;padding:1px 6px;font-size:10.5px;font-weight:700;margin-left:5px;vertical-align:1px;text-transform:uppercase;letter-spacing:.3px}
.chip.s{background:#123d2e;color:var(--good)}.chip.i{background:#4a2c10;color:var(--gold)}.chip.q{background:var(--btn);color:var(--mute)}
.proj{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:2px;flex-wrap:wrap}.proj b{color:var(--ink);font-size:13px}
.mk{display:grid;grid-template-columns:34px repeat(3,1fr);gap:5px;align-items:stretch;margin-top:7px}
.mk .lb{font-size:11.5px;font-weight:700;color:var(--mute);align-self:center}
.od{background:var(--btn);border:1px solid transparent;border-radius:6px;padding:4px 2px;text-align:center;line-height:1.15;min-width:0}
.od:hover{background:var(--btnh)}.od.on{background:var(--acc);border-color:#7fb0ff}
.od .l{font-size:11px;color:var(--mute)}.od.on .l{color:#d8e6ff}.od .o{font-weight:800;font-size:14.5px;color:var(--gold)}.od.on .o{color:#fff}.od .p{font-size:10.5px;color:var(--mute)}.od.on .p{color:#d8e6ff}
.mk2{display:flex;gap:5px;margin-top:5px}.mk2 .od{flex:1;display:flex;justify-content:space-between;padding:6px 10px;align-items:center;text-align:left}
.l5t{background:none;border:0;color:var(--acc);font-size:12px;padding:6px 0 0}
.l5{display:none;margin-top:4px}.l5.open{display:block}
.l5 table{width:100%;border-collapse:collapse;font-size:12.5px}.l5 th{color:var(--mute);font-weight:500;font-size:11px;text-align:center}.l5 td,.l5 th{padding:3px 4px;text-align:center}.l5 td:first-child,.l5 th:first-child{text-align:left;color:var(--mute)}
.hi{color:var(--good);font-weight:700}.lo{color:var(--bad)}
/* slip */
.slip{position:sticky;top:78px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:10px;padding:12px}
.slip h2{display:flex;justify-content:space-between;align-items:center}.badge{background:var(--gold);color:#000;border-radius:99px;padding:0 8px;font-size:12px}
.lg{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}.lg small{color:var(--mute);display:block}.lg a{color:var(--bad);cursor:pointer;font-size:18px;line-height:1}
.big{font-size:30px;font-weight:800;line-height:1}.kv{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}
.inp{background:var(--bg2);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:7px 9px;font:inherit;width:100%}
.btn{background:var(--btn);border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-weight:600}.btn:hover{background:var(--btnh)}
.btn.p{background:var(--gold);border-color:var(--gold);color:#101010}.btn.w{width:100%}
.edge{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}.edge.g{background:#0f3a2a;border:1px solid #1d7a55}.edge.b{background:#3d1a1a;border:1px solid #8a3030}
@media(max-width:960px){.slip{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:14px 14px 0 0;z-index:30;max-height:75vh;overflow:auto}.slip.min .sb{display:none}.slip h2{cursor:pointer}}
.note{background:var(--card2);border-left:3px solid var(--acc);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--mute);margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t th,table.t td{padding:6px;border-bottom:1px solid var(--line);text-align:right}table.t th:first-child,table.t td:first-child{text-align:left}table.t th{color:var(--mute);font-weight:500}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 280px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
</style>
</head>
<body>
<header><div class="hw">
  <div class="brand">NBA <b>TOP-3</b></div>
  <nav id="nav"></nav>
  <div class="who"><span id="meta"></span> · <span id="me"></span> <button onclick="login(true)">change</button></div>
</div></header>
<div class="wrap" id="wrap"><main id="app"></main><aside id="slipwrap"></aside></div>

<script>
const $=s=>document.querySelector(s);
const TABS=[["today","Games"],["picks","Friends' picks"],["bets","Bets & scorecard"],["player","Player card"]];
const NAMES={ATL:"Hawks",BOS:"Celtics",BKN:"Nets",CHA:"Hornets",CHI:"Bulls",CLE:"Cavaliers",DAL:"Mavericks",DEN:"Nuggets",DET:"Pistons",GS:"Warriors",HOU:"Rockets",IND:"Pacers",LAC:"Clippers",LAL:"Lakers",MEM:"Grizzlies",MIA:"Heat",MIL:"Bucks",MIN:"Timberwolves",NO:"Pelicans",NY:"Knicks",OKC:"Thunder",ORL:"Magic",PHI:"76ers",PHX:"Suns",POR:"Trail Blazers",SAC:"Kings",SA:"Spurs",TOR:"Raptors",UTAH:"Jazz",WSH:"Wizards"};
let tab=localStorage.tab&&TABS.some(t=>t[0]==localStorage.tab)?localStorage.tab:"today";
let slate=[],legs=[],playerId=null,meta={},calc=null,openGames=new Set(),filt={q:"",day:"all",start:false},slipMin=true;
const hdr=()=>({"Content-Type":"application/json","X-User":localStorage.user||"","X-Code":localStorage.code||""});
async function api(p,o={}){const r=await fetch("/api/"+p,{...o,headers:{...hdr(),...(o.headers||{})}});
  if(r.status==401){login(true,"Wrong access code");throw"auth"}
  if(!r.ok){const e=await r.json().catch(()=>({}));alert(e.detail||"Something went wrong");throw e}return r.json()}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b)});
function login(force,msg){if(!force&&localStorage.user)return;
  const n=prompt((msg?msg+"\n":"")+"Your name (shown on your picks):",localStorage.user||"");if(n)localStorage.user=n.trim();
  const c=prompt("Access code:",localStorage.code||"");if(c!==null)localStorage.code=c.trim();
  $("#me").textContent=localStorage.user||"guest";if(force)location.reload()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=x=>x==null?"–":(x*100).toFixed(x<0.1?1:0)+"%";
const dec=p=>p>0.001?(1/p).toFixed(2):"–";
const logo=a=>`https://a.espncdn.com/i/teamlogos/nba/500/${a.toLowerCase()}.png`;
const face=id=>`https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;
const ini=n=>n.split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("");
const photo=(id,n,big)=>`<span class="ph${big?" l":""}" data-i="${esc(ini(n))}"><img src="${face(id)}" alt="" loading="lazy" onerror="this.remove()"></span>`;
const timeOf=s=>new Date(s).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const dayKey=s=>{const d=new Date(s),t=new Date();const k=x=>x.toDateString();const tm=new Date(t.getTime()+864e5);return k(d)==k(t)?"Today":k(d)==k(tm)?"Tomorrow":d.toLocaleDateString([],{weekday:"long",day:"numeric",month:"short"})};
const statName={pts:"PTS",reb:"REB",ast:"AST",dd:"Double-double",td:"Triple-double"};

function nav(){$("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
function go(t,pid){tab=t;localStorage.tab=t;if(pid)playerId=pid;nav();render();scrollTo(0,0)}
async function render(){const a=$("#app");a.innerHTML='<p class="mute">Loading…</p>';$("#wrap").classList.toggle("nos",tab!="today");
  try{await({today,picks,bets,player})[tab](a)}catch(e){console.error(e)};drawSlip()}

/* ---------- bet slip ---------- */
const key=l=>[l.game_id,l.player_id,l.stat,l.line,l.side].join("|");
const nameOf=(g,pid)=>{for(const x of slate)if(x.game_id==g)for(const t of Object.values(x.teams))for(const p of t.players)if(p.player_id==pid)return p.player;return pid};
const legText=l=>`${l.text||nameOf(l.game_id,l.player_id)}`;
const legDesc=l=>["dd","td"].includes(l.stat)?statName[l.stat]:`Over ${l.line} ${statName[l.stat]}`;
function toggle(g,p,stat,line){const l={game_id:g,player_id:p,stat,line,side:"over"};const k=key(l);
  const i=legs.findIndex(x=>key(x)==k);
  if(i>=0)legs.splice(i,1);else{legs=legs.filter(x=>!(x.game_id==g&&x.player_id==p&&x.stat==stat));
    legs.push({...l,text:nameOf(g,p)});if(legs.length>6)legs.shift();if(innerWidth>960)slipMin=false}
  calc=null;paintSel();drawSlip();recalc()}
function paintSel(){const on=new Set(legs.map(key));document.querySelectorAll(".od[data-k]").forEach(b=>b.classList.toggle("on",on.has(b.dataset.k)))}
let tmr;function recalc(){clearTimeout(tmr);tmr=setTimeout(async()=>{if(!legs.length){calc=null;drawSlip();return}
  const o=parseFloat(($("#podds")||{}).value)||null;
  try{const r=await post("parlay",{legs:legs.map(({game_id,player_id,stat,line,side})=>({game_id,player_id,stat,line,side})),odds:o});calc={r,o};drawSlip()}catch(e){}},250)}
function drawSlip(){const w=$("#slipwrap");if(tab!="today"){w.innerHTML="";return}
  const fid=document.activeElement&&document.activeElement.id;
  const keep=($("#podds")||{}).value||"",stake=($("#stake")||{}).value||"",note=($("#note")||{}).value||"";
  const r=calc&&calc.r;
  w.innerHTML=`<div class="slip ${slipMin?"min":""}"><h2 onclick="slipMin=!slipMin;drawSlip()"><span>Bet slip <span class="badge">${legs.length}</span></span><span class="mute" style="font-weight:400">${r&&legs.length?pct(r.joint)+" win chance · "+(slipMin?"tap to open":"tap to close"):""}</span></h2><div class="sb">
  ${legs.length?legs.map((l,i)=>`<div class="lg"><div>${esc(legText(l))}<small>${legDesc(l)}${r&&r.legs[i]?` · model ${pct(r.legs[i].p)}`:""}</small></div><a onclick="legs.splice(${i},1);calc=null;paintSel();drawSlip();recalc()">×</a></div>`).join(""):'<p class="mute">Tap any odds button to add a leg. Aim for 2–3 legs.</p>'}
  ${legs.length?`<div style="margin:10px 0"><div class="mute">Chance all legs win</div><div class="big">${r?pct(r.joint):"…"}</div>
   <div class="kv"><span class="mute">Fair odds</span><b>${r&&r.fair_odds?r.fair_odds.toFixed(2):"–"}</b></div>
   ${r&&legs.length>1?`<div class="kv"><span class="mute">If legs were unrelated</span><span>${pct(r.independent)}</span></div>`:""}</div>
   <label class="mute">Sportsbet odds for this multi (decimal)</label><input class="inp" id="podds" type="number" step="0.01" min="1.01" placeholder="e.g. 3.60" value="${esc(keep)}" oninput="recalc()">
   ${r&&r.value?`<div class="edge ${r.value.edge>0?"g":"b"}"><b>${r.value.edge>0?"+":""}${(r.value.edge*100).toFixed(1)} pts edge</b> · EV ${r.value.ev>=0?"+":""}${r.value.ev.toFixed(2)} per $1<br><span class="mute">${r.value.edge>0?"Model rates this higher than the price implies.":"Price is better than the model thinks. Consider skipping."}</span></div>`:""}
   <input class="inp" id="note" placeholder="Note for friends (optional)" style="margin:6px 0" value="${esc(note)}">
   <div style="display:flex;gap:6px"><input class="inp" id="stake" type="number" placeholder="Stake $" style="width:95px" value="${esc(stake)}"><button class="btn" style="flex:1" onclick="share()">Share pick</button><button class="btn p" style="flex:1" onclick="logBet()">Log bet</button></div>
   <p class="mute" style="margin:8px 0 0">Model edges are small. Log bets to see how it really performs.</p>`:""}
  </div></div>`;
  if(fid&&$("#"+fid)){const e=$("#"+fid);e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(x){}}}
async function share(){login();if(!calc)return;await post("picks",{legs,note:$("#note").value,odds:calc.o,model_prob:calc.r.joint});legs=[];calc=null;go("picks")}
async function logBet(){login();const s=parseFloat($("#stake").value);if(!s||!calc||!calc.o){alert("Enter the Sportsbet odds and your stake first");return}
  await post("bets",{legs,stake:s,odds:calc.o,model_prob:calc.r.joint});legs=[];calc=null;go("bets")}

/* ---------- games ---------- */
async function loadSlate(){slate=await api("slate")}
const od=(g,p,s,l,prob)=>`<button class="od" data-k="${[g,p,s,l,"over"].join("|")}" onclick="toggle('${g}','${p}','${s}',${l})"><div class="l">O ${l}</div><div class="o">${dec(prob)}</div><div class="p">${pct(prob)}</div></button>`;
function playerHTML(p){
  const mk=["pts","reb","ast"].map(s=>{const lad=p.ladders[s];let i=lad.findIndex(x=>x.line>p.proj[s]);if(i<0)i=lad.length-1;
    const pick=[lad[Math.max(0,i-1)],lad[i],lad[Math.min(lad.length-1,i+1)]].filter((x,j,a)=>a.findIndex(y=>y.line==x.line)==j);
    return `<div class="lb">${s.toUpperCase()}</div>`+pick.map(x=>od(p.game_id,p.player_id,s,x.line,x.p_over)).join("")}).join("");
  const l5=p.last5||[];const av=k=>l5.length?(l5.reduce((a,x)=>a+x[k],0)/l5.length).toFixed(1):"–";
  const inj=p.injury&&p.injury.status&&p.injury.status!="Active"?`<span class="chip i">${esc(p.injury.status)}</span>`:"";
  return `<div class="pl"><div class="pt">${photo(p.player_id,p.player,true)}<div style="min-width:0"><span class="pn" onclick="go('player','${p.player_id}')">${esc(p.player)}</span>${p.starting?'<span class="chip s">Starting</span>':'<span class="chip q">Bench / TBC</span>'}${inj}
   <div class="proj"><span>Proj <b>${p.proj.pts.toFixed(1)}</b> pts · <b>${p.proj.reb.toFixed(1)}</b> reb · <b>${p.proj.ast.toFixed(1)}</b> ast</span></div></div></div>
   <div class="mk">${mk}</div>
   <div class="mk2"><button class="od" data-k="${[p.game_id,p.player_id,"dd",0,"over"].join("|")}" onclick="toggle('${p.game_id}','${p.player_id}','dd',0)"><span class="l">Double-double</span><span><span class="o">${dec(p.p_dd)}</span> <span class="p">${pct(p.p_dd)}</span></span></button>
     <button class="od" data-k="${[p.game_id,p.player_id,"td",0,"over"].join("|")}" onclick="toggle('${p.game_id}','${p.player_id}','td',0)"><span class="l">Triple-double</span><span><span class="o">${dec(p.p_td)}</span> <span class="p">${pct(p.p_td)}</span></span></button></div>
   ${l5.length?`<button class="l5t" onclick="this.nextElementSibling.classList.toggle('open');this.textContent=this.nextElementSibling.classList.contains('open')?'Hide last 5 ▴':'Last 5 · avg ${av("pts")} / ${av("reb")} / ${av("ast")} ▾'">Last 5 · avg ${av("pts")} / ${av("reb")} / ${av("ast")} ▾</button>
   <div class="l5"><table><tr><th></th><th>PTS</th><th>REB</th><th>AST</th><th>MIN</th></tr>${l5.map(g=>`<tr><td>${g.home?"vs":"@"} ${g.opp}</td><td class="${g.pts>p.proj.pts+3?"hi":g.pts<p.proj.pts-5?"lo":""}">${g.pts}</td><td class="${g.reb>p.proj.reb+2?"hi":g.reb<p.proj.reb-2?"lo":""}">${g.reb}</td><td class="${g.ast>p.proj.ast+2?"hi":g.ast<p.proj.ast-2?"lo":""}">${g.ast}</td><td>${Math.round(g.min)}</td></tr>`).join("")}</table><div class="mute" style="font-size:11px">Green = well above today's projection, red = well below.</div></div>`:""}</div>`}
function gameHTML(g){const t=Object.values(g.teams),away=t.find(x=>!x.home)||t[0],home=t.find(x=>x.home)||t[1];
  const open=openGames.has(g.game_id);const all=[...(away?away.players:[]),...(home?home.players:[])];
  const side=(tm)=>`<div><div class="th"><img src="${logo(tm.team)}" alt="">${NAMES[tm.team]||tm.team} <span>${esc(tm.lineup||"Lineup not posted")}</span></div>${tm.players.map(playerHTML).join("")}</div>`;
  return `<div class="game ${open?"open":""}" id="g${g.game_id}"><button class="gh" onclick="tg('${g.game_id}')">
   <div class="tm"><img src="${logo(away.team)}" alt=""><div><b>${NAMES[away.team]||away.team}</b><small>${away.team}</small></div></div>
   <div class="mid"><div class="t">${timeOf(g.start)}</div><div class="s">at</div></div>
   <div class="tm r"><div><b>${NAMES[home.team]||home.team}</b><small>${home.team}</small></div><img src="${logo(home.team)}" alt=""></div>
   <div class="av">${all.map(p=>photo(p.player_id,p.player)).join("")}</div><span class="chev">▾</span></button>
   <div class="gb"><div class="cols">${side(away)}${side(home)}</div></div></div>`}
function tg(id){const el=$("#g"+id);if(openGames.has(id))openGames.delete(id);else openGames.add(id);el.classList.toggle("open")}
function drawGames(){const q=filt.q.toLowerCase();let gs=slate.filter(g=>{
    if(filt.day!="all"&&dayKey(g.start)!=filt.day)return false;
    if(q){const txt=Object.values(g.teams).map(t=>t.team+" "+(NAMES[t.team]||"")+" "+t.players.map(p=>p.player).join(" ")).join(" ").toLowerCase();if(!txt.includes(q))return false}return true});
  if(filt.start)gs=gs.map(g=>({...g,teams:Object.fromEntries(Object.entries(g.teams).map(([k,t])=>[k,{...t,players:t.players.filter(p=>p.starting)}]))}));
  let h="",last="";for(const g of gs){const d=dayKey(g.start);if(d!=last){h+=`<div class="day">${d}</div>`;last=d}h+=gameHTML(g)}
  $("#glist").innerHTML=h||'<div class="empty">No games match.</div>';paintSel()}
async function today(a){await loadSlate();
  if(!slate.length){a.innerHTML='<div class="card empty">No upcoming games right now. The app refreshes every few hours.</div>';return}
  const days=[...new Set(slate.map(g=>dayKey(g.start)))];
  a.innerHTML=`<div class="tools"><input id="q" placeholder="Search team or player" value="${esc(filt.q)}" oninput="filt.q=this.value;drawGames()">
   <button class="pill ${filt.day=="all"?"on":""}" onclick="filt.day='all';rt()">All</button>${days.map(d=>`<button class="pill ${filt.day==d?"on":""}" onclick="filt.day='${d}';rt()">${d}</button>`).join("")}
   <button class="pill ${filt.start?"on":""}" onclick="filt.start=!filt.start;rt()">Starters only</button>
   <button class="pill" onclick="slate.forEach(g=>openGames.add(g.game_id));drawGames()">Expand all</button><button class="pill" onclick="openGames.clear();drawGames()">Collapse all</button></div>
   <div class="note">Each game lists the top-3 producers per team. Prices on buttons are the model's <b>fair odds</b> and chance; compare with Sportsbet. Tap a button to add it to the bet slip.</div><div id="glist"></div>`;drawGames()}
const rt=()=>render();

/* ---------- other tabs ---------- */
async function picks(a){login();const ps=await api("picks");
  a.innerHTML=ps.length?ps.map(p=>`<div class="card"><b>${esc(p.user)}</b> <span class="mute">${new Date(p.created).toLocaleString()}</span>
   ${p.legs.map(l=>`<div class="lg"><div>${esc(l.text||"")}<small>${legDesc(l)}</small></div></div>`).join("")}
   <div class="mute" style="margin:6px 0">${p.odds?`Odds ${p.odds} · `:""}${p.model_prob!=null?`Model ${pct(p.model_prob)}`:""}</div>${p.note?`<p>${esc(p.note)}</p>`:""}
   <button class="btn" onclick="vote(${p.id},1)">👍</button> <button class="btn" onclick="vote(${p.id},-1)">👎</button> <b>${p.score}</b> <span class="mute">(${p.voters} votes)</span>
   ${p.comments.map(c=>`<div class="mute" style="margin-top:4px"><b style="color:var(--ink)">${esc(c.user)}:</b> ${esc(c.body)}</div>`).join("")}
   <div style="display:flex;gap:6px;margin-top:8px"><input class="inp" id="c${p.id}" placeholder="Comment"><button class="btn" onclick="cmt(${p.id})">Post</button></div></div>`).join(""):'<div class="card empty">No picks shared yet. Add legs to the bet slip on the Games tab and press “Share pick”.</div>'}
async function vote(id,v){await post(`picks/${id}/vote`,{v});render()}
async function cmt(id){const b=$("#c"+id).value.trim();if(b){await post(`picks/${id}/comment`,{body:b});render()}}
async function bets(a){login();const s=await api("scorecard");const m=s.model.stats;
  a.innerHTML=`<div class="card"><h2>Bets</h2><table class="t"><tr><th>Who</th><th>Settled</th><th>Hit rate</th><th>Model expected</th><th>ROI</th></tr>`+
   (s.users.map(u=>`<tr><td>${esc(u.user)}</td><td>${u.settled}/${u.bets}</td><td>${pct(u.hit_rate)}</td><td>${pct(u.expected_hit_rate)}</td><td class="${u.roi>0?"good":"bad"}">${u.roi==null?"–":(u.roi*100).toFixed(0)+"%"}</td></tr>`).join("")||'<tr><td colspan=5 class="mute">No bets logged yet.</td></tr>')+`</table>
   <h3>Recent</h3><table class="t">`+s.bets.map(b=>{const l=JSON.parse(b.legs);return `<tr><td>${esc(b.user)}: ${l.map(x=>esc(x.text||"")+" "+legDesc(x)).join(" + ")}</td><td>$${b.stake} @ ${b.odds}</td><td>${b.result}</td><td>${b.user==localStorage.user?`<button class="btn" onclick="res(${b.id},'won')">won</button> <button class="btn" onclick="res(${b.id},'lost')">lost</button> <button class="btn" onclick="res(${b.id},'void')">void</button>`:""}</td></tr>`}).join("")+`</table></div>
   <div class="card"><h2>Model scorecard</h2><p class="mute">Backtest: trained on games before ${s.model.cut}, scored on ${s.model.n_test.toLocaleString()} later player-games.</p>
   <table class="t"><tr><th>Stat</th><th>Model error</th><th>10-game avg error</th></tr>${["pts","reb","ast"].map(k=>`<tr><td>${k.toUpperCase()}</td><td>${m[k].mae_model.toFixed(2)}</td><td>${m[k].mae_10game_avg.toFixed(2)}</td></tr>`).join("")}</table>
   ${["dd","td"].map(k=>`<h3>${statName[k]} calibration (${m[k].events} events)</h3><table class="t"><tr><th>Predicted range</th><th>Games</th><th>Predicted</th><th>Actual</th></tr>${m[k].calibration.map(c=>`<tr><td>${c.bin}</td><td>${c.n}</td><td>${pct(c.pred)}</td><td>${pct(c.actual)}</td></tr>`).join("")}</table>`).join("")}
   <p class="mute">Takeaway: the model beats a plain recent average only slightly. The useful edge is comparing its probability with the bookmaker's price and tracking real results.</p></div>`}
async function res(id,r){await post(`bets/${id}/result`,{result:r});render()}
async function player(a){
  if(!playerId){await loadSlate();const p=slate[0]&&Object.values(slate[0].teams)[0].players[0];if(!p){a.innerHTML='<div class="card empty">Pick a player from the Games tab.</div>';return}playerId=p.player_id}
  const d=await api("player/"+playerId);
  a.innerHTML=`<div class="card"><div class="pt">${photo(playerId,d.player,true)}<div><h2 style="margin:0">${esc(d.player)}</h2><span class="mute">${d.team} · ${d.games} games in database</span></div></div>
   <div class="proj" style="margin-top:10px"><span>Triple-doubles L10/L20/L40 <b>${d.td.l10} / ${d.td.l20} / ${d.td.l40}</b></span><span>Double-doubles L10/L20/L40 <b>${d.dd.l10} / ${d.dd.l20} / ${d.dd.l40}</b></span></div></div>
   <div class="row">`+["pts","reb","ast"].map(s=>`<div class="card"><h2>${s.toUpperCase()} <span class="mute">avg ${d.hit[s].mean20.toFixed(1)} · sd ${d.hit[s].sd20.toFixed(1)} (L20)</span></h2>
    <table class="t"><tr><th>Over</th><th>L5</th><th>L10</th><th>L20</th><th>L40</th></tr>${d.hit[s].rows.map(r=>`<tr><td>${r.line}</td>${[5,10,20,40].map(w=>`<td class="${r["l"+w]>=.8?"good":r["l"+w]<=.3?"bad":""}">${pct(r["l"+w])}</td>`).join("")}</tr>`).join("")}</table></div>`).join("")+`</div>
   <div class="card"><h2>Last 10 games</h2><table class="t"><tr><th>Date</th><th>Opp</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>TD</th></tr>${d.last.map(g=>`<tr><td>${g.date}</td><td>${g.home?"vs":"@"} ${g.opp}</td><td>${g.min}</td><td>${g.pts}</td><td>${g.reb}</td><td>${g.ast}</td><td>${g.td?"✔":""}</td></tr>`).join("")}</table></div>`}

(async()=>{login();$("#me").textContent=localStorage.user||"guest";nav();
  try{meta=await api("meta");$("#meta").textContent=`Data to ${meta.data_through}`}catch(e){}
  render()})();
</script>
</body>
</html>
