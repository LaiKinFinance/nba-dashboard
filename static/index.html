<script>
const $=s=>document.querySelector(s);
const TABS=[["best","Best picks"],["today","Games"],["pk","Picks"],["players","Teams"]];      // the Model page opens from the logo
try{if(!localStorage.seenModel)document.getElementById("mlogo").classList.add("glow")}catch(e){}      // the logo glows a few times until the Model page has been opened once
const NAMES={ATL:"Hawks",BOS:"Celtics",BKN:"Nets",CHA:"Hornets",CHI:"Bulls",CLE:"Cavaliers",DAL:"Mavericks",DEN:"Nuggets",DET:"Pistons",GS:"Warriors",HOU:"Rockets",IND:"Pacers",LAC:"Clippers",LAL:"Lakers",MEM:"Grizzlies",MIA:"Heat",MIL:"Bucks",MIN:"Timberwolves",NO:"Pelicans",NY:"Knicks",OKC:"Thunder",ORL:"Magic",PHI:"76ers",PHX:"Suns",POR:"Trail Blazers",SAC:"Kings",SA:"Spurs",TOR:"Raptors",UTAH:"Jazz",WSH:"Wizards"};
let tab="best";   // the app always opens on Best picks (the home tab)
let slate=[],best=null,legs=[],playerId=null,meta={},calc=null,openGames=new Set(),filt={q:"",day:"all",start:false},slipMin=true,snaps={},alerts=[],live={};
const hdr=()=>({"Content-Type":"application/json","X-User":localStorage.user||"","X-Code":localStorage.code||""});
const TIMES=[];const tnote=(p,ms)=>{if(TIMES.length<60)TIMES.push({p,ms:Math.round(ms)})};
setInterval(()=>{if(!TIMES.length||!localStorage.code&&!localStorage.user)return;const t=TIMES.splice(0);fetch("/api/timing",{method:"POST",headers:hdr(),body:JSON.stringify({t})}).catch(()=>{})},20e3);      // page timings, so slowness can be measured
/* ---------- instant open: show the copy this phone saved last time, then swap in fresh data ---------- */
const SAVE_OK=/^(meta|slate|best|value|calls|lineups|started|live|steady|track|leaderboard|scorecard|status)(\?|$|\/)/,SV="nbaSaved:",SAVE_MAX_H=18;
let booting=true,svPend=0,svUsed=false,quietRender=false;
const svGet=p=>{try{const j=JSON.parse(localStorage.getItem(SV+p)||"null");return j&&Date.now()-j.t<SAVE_MAX_H*3600e3?j.v:null}catch(e){return null}};
const svPut=(p,v)=>{try{const t=JSON.stringify({t:Date.now(),v});if(t.length<1.5e6)localStorage.setItem(SV+p,t)}catch(e){}};
function showUpd(on){let el=$("#upd");if(!el&&on){el=document.createElement("div");el.id="upd";el.textContent="Updating…";document.body.appendChild(el)}if(el)el.style.display=on?"":"none"}
function savedFirst(p,real){      // real() fetches fresh data; while the app is opening, answer at once from the saved copy
  if(!SAVE_OK.test(p))return real();
  const fresh=real().then(v=>{svPut(p,v);return v});
  const old=booting?svGet(p):null;if(old==null)return fresh;
  svUsed=true;svPend++;showUpd(true);
  fresh.catch(()=>{}).finally(()=>{if(--svPend)return;showUpd(false);if(!svUsed)return;svUsed=false;
    for(const k in memo)delete memo[k];lastLoad=0;      // drop the saved copies so the redraw uses fresh data
    const f=document.activeElement;if(f&&/INPUT|TEXTAREA|SELECT/.test(f.tagName))return;      // never wipe what someone is typing
    quietRender=true;render().finally(()=>{quietRender=false})});
  return Promise.resolve(old)}
function api(p,o={}){return o.method?apiNet(p,o):savedFirst(p,()=>apiNet(p,o))}
async function apiNet(p,o={}){const t0=performance.now();const r=await fetch("/api/"+p,{...o,headers:{...hdr(),...(o.headers||{})}});if(!o.method)tnote(p.split("/")[0],performance.now()-t0);
  if(r.status==401){showLogin("That access code isn't right. Try again.");throw"auth"}
  if(!r.ok){const e=await r.json().catch(()=>({}));alert(e.detail||"Something went wrong");throw e}return r.json()}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b)});
const memo={};const apiMemo=(p,ms=30e3)=>{const m=memo[p];if(m&&Date.now()-m.t<ms)return m.v;const v=api(p);memo[p]={t:Date.now(),v};v.catch(()=>{delete memo[p]});return v};      // switching back to a tab within 30 s shows what was just loaded
function showLogin(msg){$("#modal").innerHTML=`<div class="modal"><form class="card" onsubmit="saveLogin(event)"><h2>Welcome</h2>${msg?`<p class="bad">${msg}</p>`:`<p class="mute">Enter your name (shown on your picks) and the access code you were given.</p>`}
  <label class="mute">Your name</label><input class="inp" id="ln" value="${esc(localStorage.user||"")}" autocomplete="nickname" style="margin:4px 0 10px">
  <label class="mute">Access code</label><input class="inp" id="lc" value="${esc(localStorage.code||"")}" autocomplete="off" style="margin:4px 0 14px"><button class="btn p" style="width:100%">Continue</button></form></div>`;setTimeout(()=>$("#ln").focus(),50)}

/* ---------- welcome: shown once on each phone, and kept as "About this app" on the Model page ---------- */
const welcomeBody=()=>`<p style="margin:0 0 10px">This app predicts how NBA players will do in tonight's games.</p>
  <b>How it works</b><ul class="why" style="margin:4px 0 10px">
  <li>A computer model studies every player's recent games, minutes, opponent and which teammates are out, then estimates their points, rebounds and assists and the chance they go over a number.</li>
  <li>Each night it shows the safest picks, only for players who usually hit the number, and only on lines a real bookmaker is offering.</li>
  <li>Every pick is saved before tip-off and marked won or lost automatically after the game, so you can always see how the app is really doing.</li></ul>
  <b>What you can do</b><ul class="why" style="margin:4px 0 10px">
  <li><b>Best picks</b>: today's top picks and yesterday's results.</li>
  <li><b>Games</b>: live scores, lineups and the best 3 picks for each game.</li>
  <li><b>Picks</b>: save your own picks and compare with friends.</li>
  <li><b>Teams</b>: rosters, player averages and the most consistent players.</li>
  <li><b>Tap the logo</b> (top left): results, how the app works and MythBusters.</li></ul>
  <p class="mute" style="margin:0">A prediction app for fun. No real money is involved.</p>`;
function showWelcome(){$("#modal").innerHTML=`<div class="modal"><div class="card wel"><h2 style="display:flex;align-items:center;gap:10px;margin-top:0"><img src="/icon-v2-192.png" alt="" style="width:30px;height:30px;border-radius:7px">Welcome to NBA Dashboard</h2>${welcomeBody()}<button class="btn p" style="width:100%;margin-top:14px" onclick="closeWelcome()">Let's go</button></div></div>`}

const FACE_SZ={s:[132,96],"":[132,96],l:[200,145],xl:[320,232]};   // about 3x the shown size, so photos stay sharp on phones

const face=(id,sz)=>{const [w,h]=FACE_SZ[sz||""]||FACE_SZ.l;return `https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/${encodeURIComponent(id)}.png&w=${w}&h=${h}`};
document.addEventListener("error",e=>{const el=e.target;if(el.tagName!=="IMG"||el.dataset.full!==undefined)return;const m=/combiner\/i\?img=([^&]+)/.exec(el.src||"");if(m&&!el.dataset.tried){el.dataset.tried=1;el.src="https://a.espncdn.com"+m[1]}},true);   // a logo whose smaller copy fails falls back to the full-size image

  else if(!navFromBack&&(c.tab!=s.tab||c.playerId!=s.playerId||c.ptTeam!=s.ptTeam||c.picksView!=s.picksView||c.modelView!=s.modelView))history.pushState({nba:1,...s},"")}catch(e){}}
addEventListener("popstate",e=>{const s=e.state;if(!s||!s.nba)return;navFromBack=true;try{tab=s.tab;playerId=s.playerId;ptTeam=s.ptTeam;picksView=s.picksView;modelView=s.modelView||"track";nav();render();scrollTo(0,0)}finally{navFromBack=false}});
async function render(){navSync();const T0=performance.now(),T_TAB=tab+(tab=="best"?"/"+bestView:"");const a=$("#app");if(!quietRender)a.innerHTML='<p class="mute">Loading…</p>';$("#wrap").classList.toggle("nos",!SLIPTABS.includes(tab));
  clearInterval(liveTimer);try{await({today,best:bestTab,pk:picksTab,players,model:modelTab})[tab](a)}catch(e){console.error(e)};drawSlip();paintAddBtns();tnote("tab:"+T_TAB,performance.now()-T0)}

/* ---------- finding players on the slate ---------- */
const findP=(g,pid)=>{for(const x of slate)if(x.game_id==g)for(const t of Object.values(x.teams))for(const p of t.players)if(p.player_id==pid)return p;return null};
const allPlayers=()=>slate.flatMap(g=>Object.values(g.teams).flatMap(t=>t.players));

/* ---------- bet slip ---------- */
const key=l=>[l.game_id,l.player_id||"",l.stat,l.line,l.side,l.team||"",l.lo||""].join("|");
const grp=x=>x=="ml"||x=="spread"||x=="band"?"side":x=="total"||x=="tt"?"total":null;
const sgn=x=>x>0?"+"+x:""+x;
const legDesc=l=>esc(l.stat=="ml"?"To win":l.stat=="spread"?`Handicap ${sgn(l.side=="home"?l.line:-l.line)}`:l.stat=="total"?`${l.side=="over"?"Over":"Under"} ${l.line} total points`:l.stat=="tt"?`Team total ${l.side} ${l.line}`:l.stat=="band"?`Win by ${l.hi?l.lo+"–"+l.hi:l.lo+"+"}`:["dd","td"].includes(l.stat)?(l.side=="under"?"No ":"")+statName[l.stat]:(l.kind=="atleast"?`${l.line} or more ${statName[l.stat]}`:`${l.side=="under"?"Under":"Over"} ${l.line} ${statName[l.stat]}`));
function addLeg(l,quiet){const i=legs.findIndex(x=>key(x)==key(l));
  if(i>=0){if(!quiet)legs.splice(i,1)}else{
    legs=legs.filter(x=>grp(l.stat)?!(x.game_id==l.game_id&&grp(x.stat)==grp(l.stat)):!(x.game_id==l.game_id&&x.player_id==l.player_id&&x.stat==l.stat));
    legs.push(l);if(legs.length>6)legs.shift();
    const p=l.player_id&&findP(l.game_id,l.player_id);if(p)snaps[l.player_id]={starting:p.starting,injury:(p.injury&&p.injury.status)||null}}}
function pickTeam(g,stat,side,line,price,book,prob,text,team,lo,hi){addLeg({game_id:g,stat,line,side,text,price:price||null,book:book||null,p:prob,team:team||undefined,lo:lo||undefined,hi:hi||undefined});calc=null;paintSel();drawSlip();recalc()}
function pick(g,pid,stat,line,price,book,prob,hit,n){const p=findP(g,pid);addLeg({game_id:g,player_id:pid,stat,line,side:"over",text:p?p.player:pid,price:price||null,book:book||null,p:prob,hit,n});
  calc=null;paintSel();drawSlip();recalc()}
function paintSel(){paintAddBtns();const on=new Set(legs.map(key));document.querySelectorAll(".od[data-k]").forEach(b=>b.classList.toggle("on",on.has(b.dataset.k)))}
let tmr;function recalc(){clearTimeout(tmr);tmr=setTimeout(async()=>{if(!legs.length){calc=null;drawSlip();return}
  try{const r=await post("parlay",{legs:legsPayload()});calc={r};drawSlip()}catch(x){}},250)}
const SLIPTABS=["today","best"];
let slipDone={saved:false,shared:false,sig:""};     // which buttons have been used for the pick list as it is now; a change to the list starts afresh
function drawSlip(){const w=$("#slipwrap");if(!SLIPTABS.includes(tab)){w.innerHTML="";return}
  const sig=legs.map(key).sort().join("~");if(slipDone.sig!==sig)slipDone={saved:false,shared:false,sig};
  const fid=document.activeElement&&document.activeElement.id,note=($("#note")||{}).value||"",r=calc&&calc.r;
  const mine=alerts.filter(a=>legs.some(l=>l.player_id==a.pid));
  w.innerHTML=`<div class="slip ${slipMin?"min":""}"><h2 onclick="slipMin=!slipMin;drawSlip()"><span>Pick list <span class="badge">${legs.length}</span></span><span class="mute" style="font-weight:400">${r&&r.joint!=null&&legs.length?pct(r.joint)+" estimated chance · "+(slipMin?"tap to open":"tap to close"):""}</span></h2><div class="sb">
  ${mine.map(a=>`<div class="alert"><span>⚠ ${esc(a.msg)}</span><a onclick="alerts=alerts.filter(x=>x!==alerts[${alerts.indexOf(a)}]);drawSlip()">dismiss</a></div>`).join("")}
  ${legs.length>1?`<div style="text-align:right;margin:2px 0 6px"><button class="btn" onclick="clearSlip()">Clear picks</button></div>`:""}
  ${legs.length?legs.map((l,i)=>`<div class="lg"><div>${legWho(l)}${esc(l.text)}<small>${legDesc(l)}${r&&r.legs[i]&&r.legs[i].p!=null?` · chance ${pct(r.legs[i].p)}`:""}</small></div><a onclick="legs.splice(${i},1);calc=null;paintSel();drawSlip();recalc()">×</a></div>`).join(""):'<p class="mute">Choose player or team picks to see their chances and track the results.</p>'}
  ${legs.length&&r&&r.unsupported?`<div class="note" style="margin:10px 0"><b>No advice for this pick list.</b> ${esc(r.explanation)}<br><span class="mute">Lines affected: ${r.level_legs.map(x=>esc(x.text||x.stat)+" "+legDesc(x)).join("; ")}</span></div>`:""}
  ${legs.length&&!(r&&r.unsupported)?`<div style="margin:10px 0"><div class="mute">Estimated chance all picks are right</div><div class="big">${r?pct(r.joint):"…"}</div>
   ${r&&legs.length>1?`<div class="kv"><span class="mute">If picks were unrelated</span><span>${pct(r.independent)}</span></div>`:""}</div>
   ${r&&r.points_warning?`<div class="note" style="margin:8px 0">${esc(r.points_warning)}</div>`:""}
   ${r&&r.warning?`<div class="note" style="margin:8px 0">${esc(r.warning)}</div>`:""}`:""}
  ${legs.length?`<input class="inp" id="note" placeholder="Note for friends (optional)" style="margin:6px 0" value="${esc(note)}">
   <div style="display:flex;gap:6px"><button class="btn" style="flex:1" ${slipDone.shared?"disabled":""} onclick="share()">${slipDone.shared?"Shared ✓":"Share pick"}</button><button class="btn p" style="flex:1" ${slipDone.saved?"disabled":""} onclick="logBet()">${slipDone.saved?"Saved ✓":"Save pick"}</button></div>
   ${slipDone.saved||slipDone.shared?`<div class="mute" style="margin:6px 0 0">${[slipDone.saved?`Saved on <a onclick="go('bets')" style="color:var(--acc);cursor:pointer">My picks</a>`:"",slipDone.shared?`Shared on <a onclick="go('picks')" style="color:var(--acc);cursor:pointer">Friends' picks</a>`:""].filter(Boolean).join(" · ")} <a onclick="clearSlip()" style="color:var(--acc);cursor:pointer">Clear list</a></div>`:""}
   <p class="mute" style="margin:8px 0 0">These are estimates. Save picks to see how often they are right.</p>`:""}
  </div></div>`;
  if(fid&&$("#"+fid)){const el=$("#"+fid);el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(x){}}}
function clearSlip(){legs=[];calc=null;paintSel();drawSlip()}
const legsPayload=()=>legs.map(l=>({game_id:l.game_id,player_id:l.player_id,stat:l.stat,line:l.line,side:l.side,team:l.team,lo:l.lo,hi:l.hi,kind:l.kind,text:l.text,price:l.price||undefined}));
async function sendPick(route,body,flag){if(!needName()||!calc||slipDone[flag])return;slipDone[flag]=true;drawSlip();     // greyed out at once, so a double tap cannot send it twice
  try{await post(route,body)}catch(e){if(!(e&&/already/i.test(e.detail||"")))slipDone[flag]=false}drawSlip()}
const pickBody=()=>({legs:legsPayload(),model_prob:calc&&calc.r.unsupported?undefined:calc&&calc.r.joint});
function share(){sendPick("picks",{...pickBody(),note:($("#note")||{}).value||""},"shared")}
function logBet(){sendPick("bets",pickBody(),"saved")}

/* ---------- live lineup/injury alerts ---------- */
async function pollStatus(){if(!legs.length)return;try{live=await api("status")}catch(e){return}
  for(const l of legs){const s=live[l.player_id],b=snaps[l.player_id];if(!s||!b)continue;
    const add=m=>{if(!alerts.some(a=>a.pid==l.player_id&&a.msg==m)){alerts.push({pid:l.player_id,msg:m});if(tab=="today")slipMin=false}};
    if(s.listed_out)add(`${s.player} is now listed OUT on the lineup page`);
    else if(s.injury&&s.injury!=b.injury&&s.injury!="Active")add(`${s.player} injury status changed to ${s.injury}`);
    if(b.starting&&!s.starting&&/Confirmed/i.test(s.lineup||""))add(`${s.player} is not in the confirmed starting five`);
    if(!b.starting&&s.starting){add(`${s.player} is now starting`);}
    snaps[l.player_id]={starting:s.starting,injury:s.injury}}
  drawSlip()}
setInterval(pollStatus,180000);

/* ---------- games tab ---------- */
let lastLoad=Date.now();
async function loadSlate(force){if(!force&&slate.length&&Date.now()-lastLoad<60e3)return;slate=await api("slate");lastLoad=Date.now()}      // reuse the games data for a minute instead of downloading it on every tab change
const oldAt=iso=>!!iso&&(Date.now()-new Date(iso).getTime())/36e5>8;     // price older than 8 hours, re-checked every time the page draws
setInterval(()=>{if(document.visibilityState!="visible"||Date.now()-lastLoad<5*60e3)return;if(tab=="today")loadSlate(true).then(()=>drawGames()).catch(()=>{});else if(tab=="best"&&!legs.length)render()},60e3);
function hitTxt(h,n){if(!n)return"";const c=h/n>=.8?"hg":h/n<=.3?"hb":"";return `<span class="${c}">${h}/${n}</span>`}
function btn(p,s,o){ // o: {line, prob, price, book, edge, hit, n}
  const val=o.price&&!o.stale&&!oldAt(p.odds_at)&&!o.no_claim&&o.edge>=0.04,bst=(o.boost||0)>=0.05,fad=!bst&&(o.fade||0)<=-0.05;const k=key({game_id:p.game_id,player_id:p.player_id,stat:s,line:o.line,side:"over"});
  return `<button class="od ${val?"val":""} ${bst?"bst":""} ${fad?"fad":""}" data-k="${k}" data-p="${o.prob}" onclick="pick('${p.game_id}','${p.player_id}','${s}',${o.line},${o.price||0},'${o.book||""}',${o.prob},${o.hit},${o.n})">${val?'<span class="vt">VALUE</span>':""}${bst?'<span class="bt">BOOST</span>':fad?'<span class="ft">FADE</span>':""}${o.alt?`<span class="alt">${bk(o.alt[1])} ${o.alt[0].toFixed(2)}</span>`:""}
   <div class="l">O ${o.line}${o.price?" · "+bk(o.book):""}</div><div class="o">${o.price?o.price.toFixed(2):dec(o.prob)}</div><div class="p">${pct(o.prob)} · ${hitTxt(o.hit,o.n)}</div></button>`}
function whyHTML(p){const ab=p.absent||[],ev=p.evidence||[];if(!ab.length)return"";
  const full=p.proj_full||{},d=k=>(p.proj[k]-(full[k]??p.proj[k]));const dtxt=["pts","reb","ast"].map(k=>`${d(k)>=0?"+":""}${d(k).toFixed(1)} ${k}`).join(", ");
  return `<details class="why-d"><summary style="font-size:12px;color:var(--c-pur-fg)">Why the change? ${ab.length} teammate${ab.length>1?"s":""} out</summary><ul class="why">`+
   ab.map(a=>`<li><b>${esc(a.name)}</b> (${a.pts.toFixed(1)} pts, ${a.reb.toFixed(1)} reb, ${a.ast.toFixed(1)} ast) – ${a.weight>=0.85?"out":"questionable"}</li>`).join("")+
   `<li>Effect vs a full-strength team: <b>${dtxt}</b></li>`+
   ev.map(e=>`<li>Without ${esc(e.who)}: <b>${e.without.pts.toFixed(1)}</b> pts / ${e.without.reb.toFixed(1)} reb / ${e.without.ast.toFixed(1)} ast in ${e.without.n} games, vs ${e.with_.pts.toFixed(1)} / ${e.with_.reb.toFixed(1)} / ${e.with_.ast.toFixed(1)} in ${e.with_.n} with him</li>`).join("")+
   (ev.length?"":`<li>Not enough games with and without this teammate for a direct comparison; the estimate comes from how all players on all teams responded to similar absences.</li>`)+`</ul></details>`}
const realLines=(p,st)=>((p.strip&&p.strip[st])||[]).filter(o=>o.price);      // only lines a bookmaker offers are shown
function statRow(p,st,lab){const L=realLines(p,st);if(!L.length)return"";
  const core=["pts","reb","ast"].includes(st),thr={pts:1,reb:.6,ast:.6}[st],effB=core?p.proj[st]-((p.proj_full||p.proj)[st]):0,effF=core?p.proj[st]-((p.proj_base||p.proj)[st]):0;   // BOOST/FADE only when the stat-level effect is meaningful
  return `<div class="mkr"><div class="lb">${lab}</div><div class="stw"><div class="strip">${L.map(o=>{const rel=o.p_over>=.3&&o.p_over<=.75;return btn(p,st,{line:o.line,prob:o.p_over,price:o.price,book:o.book,alt:o.alt,edge:o.edge,hit:o.hit,n:o.n,boost:(core&&rel&&effB>=thr)?o.boost:0,fade:(core&&rel&&effF<=-thr)?o.fade:0})}).join("")}</div></div></div>`}
function moreHTML(p){const defs=[["pra","PRA"],["pr","P+R"],["pa","P+A"],["fg3m","3PM"],["stl","STL"],["blk","BLK"]].filter(([s])=>realLines(p,s).length);if(!defs.length)return"";
  const low=defs.some(d=>d[0]=="stl"||d[0]=="blk");
  return `<details class="more"><summary>More markets: ${defs.map(d=>d[1]).join(", ")}</summary>${defs.map(([s,l])=>statRow(p,s,l)).join("")}${low?'<div class="mute" style="font-size:11px;margin-top:4px">Steals and blocks: in testing the app was no better than a plain average, so treat those as low-confidence.</div>':""}</details>`}
function playerHTML(p){
  const mk=["pts","reb","ast"].map(st=>statRow(p,st,st.toUpperCase())).join("");
  const dd=p.book&&p.book.dd,td=p.book&&p.book.td;
  const sp=(s,prob,b,h)=>{const val=b&&!b.stale&&!oldAt(p.odds_at)&&b.edge>=0.04;const k=key({game_id:p.game_id,player_id:p.player_id,stat:s,line:0,side:"over"}),hist=p.dd_td_hist||{};
    const note=s=="td"?`${hist.td||0} in ${hist.games||0} games`:`${hist.dd20||0} in last 20`;
    return `<button class="od ${val?"val":""}" data-k="${k}" data-p="${prob}" onclick="pick('${p.game_id}','${p.player_id}','${s}',0,${b?b.price:0},'${b?b.book:""}',${prob},${h.k},${h.n})">${val?'<span class="vt">VALUE</span>':""}<span class="l" style="text-align:left">${statName[s]}</span><span><span class="o">${b?b.price.toFixed(2):dec(prob)}</span><span class="p">${pct(prob)} · ${note}</span></span></button>`};
  const l10=p.last10||[],l5=l10.slice(0,5),av=k=>l5.length?(l5.reduce((a,x)=>a+x[k],0)/l5.length).toFixed(1):"–";
  const inj=p.injury&&p.injury.status&&p.injury.status!="Active"?`<span class="chip i">${esc(p.injury.status)}</span>`:"";
  return `<div class="pl"><div class="pt">${photo(p.player_id,p.player,"l")}<div style="min-width:0"><span class="pn" onclick="go('players','${p.player_id}')">${esc(p.player)}</span>${p.starting?'<span class="chip s">Starting</span>':'<span class="chip q">Starter not confirmed</span>'}${p.returning?`<span class="chip q" title="Missed ${p.returning.missed} games; players usually play fewer minutes and score a little less in their first 2 games back. No Best pick is made for him.">Returning · game ${p.returning.game_back} back</span>`:""}${p.new_team?`<span class="chip q" title="Traded or signed from ${esc(p.new_team.prev)}; players usually score a little less in their first 10 games with a new team. No Best pick is made for him.">New team · game ${p.new_team.games+1}</span>`:""}${p.frozen?'<span class="chip q" title="Made before the latest model update; shown as it was, not recalculated">Earlier estimate</span>':""}${inj}${(p.absent||[]).length?(((p.proj.pts-(p.proj_full||p.proj).pts)>=1||(p.proj.reb-(p.proj_full||p.proj).reb)>=.6||(p.proj.ast-(p.proj_full||p.proj).ast)>=.6)?'<span class="chip b">▲ Teammate out</span>':'<span class="chip q">Teammate out</span>'):""}
   <div class="proj"><span>Proj <b>${p.proj.pts.toFixed(1)}</b> pts · <b>${p.proj.reb.toFixed(1)}</b> reb · <b>${p.proj.ast.toFixed(1)}</b> ast</span></div></div></div>
   ${whyHTML(p)}${mk}${((p.show_dd&&dd)||(p.show_td&&td))?`<div class="mk2">${p.show_dd&&dd?sp("dd",p.p_dd,dd,p.dd_hit):""}${p.show_td&&td?sp("td",p.p_td,td,p.td_hit):""}</div>`:""}${moreHTML(p)}${(!mk&&!dd&&!td&&!moreHTML(p))?'<div class="mute" style="font-size:12px;margin:6px 0">No bookmaker lines for this player yet.</div>':""}
   ${l5.length?`<button class="l5t" onclick="const t=this.nextElementSibling;t.classList.toggle('open');this.textContent=t.classList.contains('open')?'Hide last 5 ▴':this.dataset.o" data-o="Last 5 · avg ${av("pts")} / ${av("reb")} / ${av("ast")} ▾">Last 5 · avg ${av("pts")} / ${av("reb")} / ${av("ast")} ▾</button>
   <div class="l5"><table><tr><th></th><th>PTS</th><th>REB</th><th>AST</th><th>MIN</th></tr>${l5.map(g=>`<tr><td>${g.home?"vs":"@"} ${g.opp}</td><td class="${g.pts>p.proj.pts+3?"hi":g.pts<p.proj.pts-5?"lo":""}">${g.pts}</td><td class="${g.reb>p.proj.reb+2?"hi":g.reb<p.proj.reb-2?"lo":""}">${g.reb}</td><td class="${g.ast>p.proj.ast+2?"hi":g.ast<p.proj.ast-2?"lo":""}">${g.ast}</td><td>${Math.round(g.min)}</td></tr>`).join("")}</table><div class="mute" style="font-size:11px">Green = well above today's projection, red = well below.</div></div>`:""}</div>`}
const gtab={};let gameIdx={};

function luSide(sd){
  const row=(p,out)=>`<div class="lp"><span class="pos">${esc(p.pos)}</span>${photo(p.player_id||0,p.name)}<span class="nm2" ${p.player_id?`onclick="go('players','${p.player_id}')"`:""}>${p.top3?"⭐ ":""}${esc(p.name)}${p.new?'<span class="newb">NEW</span>':""}</span>${out?`<span class="stc ${luChip(p.status)}">${esc(p.status)}</span>`:`<span class="dot" style="background:${dotc(p.pct)}" title="${esc(p.note||"")}"></span>`}</div>`;
  return luWrap(sd.team,`<img src="${logo(sd.team)}" alt="">${nm(sd.team)} <span class="stc ${sd.confirmed?"ok":"ex"}">${sd.confirmed?"Confirmed":"Expected"}</span><span>${esc(sd.record||"")}</span>`,
   `${sd.starters.length?sd.starters.map(p=>row(p,false)).join(""):'<div class="mute" style="padding:8px 0">Lineup not posted yet</div>'}
   ${sd.out.length?`<div class="mnp">May not play</div>`+sd.out.map(p=>row(p,true)).join(""):""}`)}
const lastGot={};const quietGetNet=async p=>{const t0=performance.now();try{const r=await fetchSoon("/api/"+p);if(r.ok)lastGot[p]=await r.json()}catch(e){}tnote(p,performance.now()-t0);return lastGot[p]||[]};const quietGet=p=>savedFirst(p,()=>quietGetNet(p));      // slow or failed: keep the last copy

/* ---------- games tab: every game of the day in one place (projections, live score, lineups) ---------- */
let gamesDay="today";
const gameDayOf=(start,state)=>{if(state=="in")return"today";const d=dayName(start);return d=="later"?"tomorrow":d};
function setGamesDay(d){gamesDay=d;render()}
function gameRows(){const rows=new Map();
  slate.forEach(g=>rows.set(g.game_id,{id:g.game_id,start:g.start,g,l:null}));
  LG.forEach(l=>{const r=rows.get(l.game_id);if(r)r.l=l;else rows.set(l.game_id,{id:l.game_id,start:l.start,g:null,l})});
  return [...rows.values()]}
const midHTML=g=>{const L=LG.find(x=>x.game_id==g.game_id);
  return L&&L.state!="pre"?`<div class="t">${L.away.score}–${L.home.score}${liveDot(g.game_id)}</div><div class="s">${esc(stLabel(L))}</div>`:`<div class="t">${timeOf(g.start)}${liveDot(g.game_id)}</div><div class="s">at</div>`};
const startedSide=sd=>luWrap(sd.team,`<img src="${logo(sd.team)}" alt="">${nm(sd.team)} <span class="mute">${sd.score??""}</span>`,`${sd.starters.length?sd.starters.map(p=>`<div class="lp">${photo(p.player_id,p.name)}<span class="nm2" onclick="go('players','${p.player_id}')">${esc(p.name)}</span></div>`).join(""):'<div class="mute" style="padding:8px 0">No starters recorded</div>'}`);
function liveBodyHTML(g){const L=LG.find(x=>x.game_id==g.game_id);return L&&L.state!="pre"?lineScore(L)+boxHTML(L):'<p class="mute">Game has not started.</p>'}
function lineupsBodyHTML(g){LUG.v=g.game_id;const id=g.game_id,L=LG.find(x=>x.game_id==id),t=Object.values(g.teams),away=t.find(x=>!x.home)||t[0],home=t.find(x=>x.home)||t[1];
  const e=LU.find(x=>x.away.team==away.team&&x.home.team==home.team),st=STARTED.find(x=>x.game_id==id),b=boxes[id];
  if(e&&(!L||L.state=="pre"))return `<div class="lu">${luSide(e.away)}${luSide(e.home)}</div>`;
  if(st)return `<div class="lu">${startedSide(st.away)}${startedSide(st.home)}</div>`;
  if(b)return `<div class="lu">${b.teams.map(tm=>startedSide({team:tm.team,score:"",starters:tm.players.filter(p=>p.starter).map(p=>({player_id:p.player_id,name:p.player}))})).join("")}</div>`;
  return e?`<div class="lu">${luSide(e.away)}${luSide(e.home)}</div>`:'<p class="mute">No lineup posted yet.</p>'}
function paintLiveSections(id){const g=gameIdx[id];if(!g)return;const a=document.getElementById(`section-${id}-live`),b=document.getElementById(`section-${id}-lineups`);if(a)a.innerHTML=liveBodyHTML(g);if(b)b.innerHTML=lineupsBodyHTML(g)}
function drawLive(){Object.keys(gameIdx).forEach(paintLiveSections);LG.forEach(l=>{if(!gameIdx[l.game_id]){const el=$("#lv"+l.game_id);if(el)el.outerHTML=liveHTML(l)}})}
async function loadBox(id){try{const r=await fetch("/api/live/"+id,{headers:hdr()});if(!r.ok)return;boxes[id]=await r.json()}catch(e){return}
  const l=LG.find(x=>x.game_id==id);if(gameIdx[id])paintLiveSections(id);else{const el=$("#lv"+id);if(el&&l&&openLive.has(id))el.outerHTML=liveHTML(l)}}
function togLive(id){if(openLive.has(id))openLive.delete(id);else openLive.add(id);const l=LG.find(x=>x.game_id==id),el=$("#lv"+id);if(l&&el)el.outerHTML=liveHTML(l);if(openLive.has(id)&&l&&l.state!="pre")loadBox(id)}
let luAt=0;
async function refreshGames(){if(tab!="today"||document.visibilityState!="visible")return;
  if(!LU.length||Date.now()-luAt>60000){luAt=Date.now();quietGet("lineups").then(lu=>{const had=JSON.stringify(LU);LU=lu||[];if(tab=="today"&&JSON.stringify(LU)!=had)drawGames()})}      // lineups keep coming in after the page opens
  const lg=await quietLive();if(!lg.length&&!LG.length)return;LG=lg;LIVEIDS=liveSet(LG);stampLive();
  document.querySelectorAll(".live-dot[data-g]").forEach(d=>{d.style.display=LIVEIDS.has(d.dataset.g)?"":"none"});
  LG.forEach(l=>{const g=gameIdx[l.game_id];if(g){const m=document.querySelector("#g"+l.game_id+" .mid");if(m)m.innerHTML=midHTML(g)}else{const el=$("#lv"+l.game_id);if(el)el.outerHTML=liveHTML(l)}});
  const ids=[...new Set([...openGames,...openLive])].filter(id=>{const l=LG.find(x=>x.game_id==id);return l&&l.state!="pre"});await Promise.all(ids.map(loadBox))}

/* ---------- theme ---------- */
function paintTheme(){const t=document.documentElement.dataset.theme;const b=$("#thm");if(b)b.textContent=t=="dark"?"☀":"☾";const m=$("#tc");if(m)m.content=t=="dark"?"#0e2452":"#0a66b3"}
function toggleTheme(){const t=document.documentElement.dataset.theme=="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.theme=t}catch(e){}paintTheme()}
/* ---------- install as app ---------- */
let deferred=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#inst").style.display="inline-block"});
async function installApp(){if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("#inst").style.display="none"}
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
const ios=/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone;
if(ios&&!localStorage.iosHint){setTimeout(()=>{if(confirm("Tip: to install this as an app, tap the Share button, then “Add to Home Screen”.\n\nShow this tip again?")===false)localStorage.iosHint=1},2500)}

(async()=>{paintTheme();$("#me").textContent=localStorage.user||"Sign in";nav();
  if(!localStorage.user){showLogin()}
  try{meta=await api("meta")}catch(e){}
  render().finally(()=>{booting=false;endIntro();if(localStorage.user&&!localStorage.welcomed)setTimeout(showWelcome,1100)})})();
</script>
