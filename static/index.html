<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA Dashboard</title>
<meta name="theme-color" content="#0e2452">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NBA Dashboard">
<style>
:root{--bg:#0a111d;--bg2:#0f1828;--card:#142034;--card2:#1a2a43;--line:#25365a;--ink:#eef3fb;--mute:#8fa1bf;--acc:#2f80ff;--gold:#ffc83d;--good:#20c27a;--bad:#ff5b5b;--btn:#1d2f4f;--btnh:#27406a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#12306b,#0e2452);border-bottom:3px solid var(--gold);padding-top:env(safe-area-inset-top)}
.hw{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px}.brand b{color:var(--gold)}
nav{display:flex;gap:2px;overflow-x:auto}nav button{background:none;border:0;color:#b8c9ea;padding:8px 12px;border-radius:6px;font-weight:600;white-space:nowrap}
nav button.on{background:rgba(255,255,255,.14);color:#fff}
.who{margin-left:auto;font-size:12.5px;color:#b8c9ea;display:flex;gap:8px;align-items:center}.who button{background:none;border:0;color:var(--gold);padding:0 2px}
.inst{background:var(--gold);color:#101010;border:0;border-radius:6px;padding:4px 10px;font-weight:700;font-size:12.5px}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 90px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.wrap.nos{grid-template-columns:minmax(0,1fr)}
@media(max-width:960px){.wrap{grid-template-columns:minmax(0,1fr)}}
.mute{color:var(--mute);font-size:13px}.good{color:var(--good)}.bad{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px}h3{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input,.inp{background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 12px;font:inherit;width:100%}
.tools input{flex:1 1 180px;width:auto;background:var(--card)}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;color:var(--mute)}.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.day{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:14px 2px 6px}
.game{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.gh{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;width:100%;background:none;border:0;text-align:left}.gh:hover{background:var(--card2)}
.tm{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 0}.tm.r{justify-content:flex-end;text-align:right}
.tm img{width:34px;height:34px;object-fit:contain;flex:none}.tm b{font-size:15px;line-height:1.1}.tm small{display:block;color:var(--mute);font-size:11.5px;font-weight:400}
.mid{text-align:center;flex:none;min-width:70px}.mid .t{font-weight:700;font-size:13px}.mid .s{font-size:11px;color:var(--mute)}
.chev{flex:none;color:var(--mute);transition:transform .15s}.game.open .chev{transform:rotate(180deg)}
.av{display:flex;margin-left:6px}.av .ph{margin-left:-8px;border:2px solid var(--card)}
.ph{position:relative;display:inline-block;width:30px;height:30px;border-radius:50%;background:var(--btn);overflow:hidden;flex:none;vertical-align:middle}
.ph::before{content:attr(data-i);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--mute)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.ph.l{width:48px;height:48px}.ph.xl{width:76px;height:76px}.ph.l::before{font-size:14px}
.gb{display:none;border-top:1px solid var(--line);padding:6px 12px 12px;background:var(--bg2)}.game.open .gb{display:block}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}@media(max-width:760px){.cols{grid-template-columns:1fr}.av{display:none}.tm img{width:28px;height:28px}}
.th{display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-weight:700}.th img{width:22px;height:22px}.th span{font-weight:400;color:var(--mute);font-size:12px}
.pl{padding:10px 0;border-bottom:1px solid var(--line)}.pl:last-child{border:0}
.pt{display:flex;gap:10px;align-items:center}.pn{font-weight:700;cursor:pointer}.pn:hover{text-decoration:underline}
.chip{display:inline-block;border-radius:4px;padding:1px 6px;font-size:10.5px;font-weight:700;margin-left:5px;vertical-align:1px;text-transform:uppercase;letter-spacing:.3px}
.chip.s{background:#123d2e;color:var(--good)}.chip.i{background:#4a2c10;color:var(--gold)}.chip.q{background:var(--btn);color:var(--mute)}
.proj{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:2px;flex-wrap:wrap}.proj b{color:var(--ink);font-size:13px}
.mk{display:grid;grid-template-columns:34px repeat(3,1fr);gap:5px;align-items:stretch;margin-top:7px}.mk .lb{font-size:11.5px;font-weight:700;color:var(--mute);align-self:center}
.od{position:relative;background:var(--btn);border:1px solid transparent;border-radius:6px;padding:4px 2px;text-align:center;line-height:1.15;min-width:0}
.od:hover{background:var(--btnh)}.od.on{background:var(--acc);border-color:#7fb0ff}
.od .l{font-size:11px;color:var(--mute)}.od.on .l{color:#d8e6ff}
.od .o{font-weight:800;font-size:14.5px;color:var(--gold)}.od.on .o{color:#fff}
.od .p{font-size:10.5px;color:var(--mute)}.od.on .p{color:#d8e6ff}.od .p .hg{color:var(--good);font-weight:700}.od .p .hb{color:var(--bad);font-weight:700}.od.on .p .hg,.od.on .p .hb{color:#fff}
.od.val{border-color:var(--good)}.od .vt{position:absolute;top:-7px;right:4px;background:var(--good);color:#04130c;font-size:9px;font-weight:800;border-radius:3px;padding:0 4px;letter-spacing:.4px}
.od .bk{font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.mk2{display:flex;gap:5px;margin-top:5px}.mk2 .od{flex:1;display:flex;justify-content:space-between;padding:6px 10px;align-items:center;text-align:left;gap:6px}.mk2 .od .p{display:block}
.l5t{background:none;border:0;color:var(--acc);font-size:12px;padding:6px 0 0}.l5{display:none;margin-top:4px}.l5.open{display:block}
.l5 table{width:100%;border-collapse:collapse;font-size:12.5px}.l5 th{color:var(--mute);font-weight:500;font-size:11px;text-align:center}.l5 td,.l5 th{padding:3px 4px;text-align:center}.l5 td:first-child,.l5 th:first-child{text-align:left;color:var(--mute)}
.hi{color:var(--good);font-weight:700}.lo{color:var(--bad)}
.slip{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:10px;padding:12px}
.slip h2{display:flex;justify-content:space-between;align-items:center}.badge{background:var(--gold);color:#000;border-radius:99px;padding:0 8px;font-size:12px}
.lg{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}.lg small{color:var(--mute);display:block}.lg a{color:var(--bad);cursor:pointer;font-size:18px;line-height:1}
.big{font-size:30px;font-weight:800;line-height:1}.kv{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}
.btn{background:var(--btn);border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-weight:600}.btn:hover{background:var(--btnh)}
.btn.p{background:var(--gold);border-color:var(--gold);color:#101010}.btn.g{background:var(--good);border-color:var(--good);color:#04130c}.btn.r{background:#5a2323;border-color:#8a3030}
.btn.xl{padding:12px 16px;font-size:15px;flex:1}
.edge{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}.edge.g{background:#0f3a2a;border:1px solid #1d7a55}.edge.b{background:#3d1a1a;border:1px solid #8a3030}
.alert{background:#4a2c10;border:1px solid #9a6a1d;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px;display:flex;justify-content:space-between;gap:8px}.alert a{cursor:pointer;color:var(--gold)}
@media(max-width:960px){.slip{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:14px 14px 0 0;z-index:30;max-height:75vh;overflow:auto;padding-bottom:calc(12px + env(safe-area-inset-bottom))}.slip.min .sb{display:none}.slip h2{cursor:pointer;margin:0}}
.note{background:var(--card2);border-left:3px solid var(--acc);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--mute);margin-bottom:12px}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.best{border-color:#3a5a2a;background:linear-gradient(180deg,#16301f,var(--card) 60%)}
.bl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #2a4a3a}.bl:last-of-type{border:0}.bl .x{flex:1;min-width:0}.bl b{display:block}
.pillrow{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.sl{flex:none;background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:170px;text-align:left}.sl:hover{background:var(--btnh)}.sl small{display:block;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}.tile .v{font-size:24px;font-weight:800}.tile .k{font-size:12px;color:var(--mute)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}table.t th:first-child,table.t td:first-child{text-align:left}table.t th{color:var(--mute);font-weight:500}
details{margin-top:10px}summary{cursor:pointer;color:var(--acc);font-size:13.5px}
.bet{padding:10px 0;border-bottom:1px solid var(--line)}.bet:last-child{border:0}
.bars{position:relative;display:flex;align-items:flex-end;gap:6px;height:150px;margin:18px 0 4px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bar i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--bad);opacity:.85}.bar.hit i{background:var(--good)}
.bar b{font-size:12px;margin-bottom:2px}.bar span{font-size:10px;color:var(--mute);margin-top:3px;white-space:nowrap}
.thr{position:absolute;left:0;right:0;border-top:2px dashed var(--gold);pointer-events:none}
.step{display:flex;align-items:center;gap:8px}.step button{width:34px;height:34px;border-radius:50%;font-size:18px;padding:0}
.srch{position:relative}.res{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;z-index:10;max-height:300px;overflow:auto}.res div{padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}.res div:hover{background:var(--card2)}
.modal{position:fixed;inset:0;background:rgba(5,9,16,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.modal .card{max-width:380px;width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 280px}
.foot{font-size:12px;color:var(--mute);margin-top:6px}
.lv{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.lh{display:flex;align-items:center;gap:8px;padding:12px;width:100%;background:none;border:0;text-align:left;cursor:pointer}.lh:hover{background:var(--card2)}
.lt{flex:1 1 0;display:flex;align-items:center;gap:10px;min-width:0}.lt.r{justify-content:flex-end;text-align:right}.lt img{width:38px;height:38px;object-fit:contain;flex:none}
.lt .sc{font-size:28px;font-weight:800;line-height:1}.lt .sc.w{color:#fff}.lt .sc.l{color:var(--mute);font-weight:600}.lt small{display:block;color:var(--mute);font-size:11.5px}
.ls{text-align:center;flex:none;min-width:84px}.ls .st{font-size:12.5px;font-weight:700}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:5px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}.ls .ft{color:var(--mute)}.ab{display:none}
@media(max-width:640px){.nm{display:none}.ab{display:inline}.lt{gap:6px}.lt img{width:30px;height:30px}.lt .sc{font-size:23px}.ls{min-width:78px}.lh{padding:10px 8px;gap:4px}}
.lb2{display:none;border-top:1px solid var(--line);padding:6px 12px 12px;background:var(--bg2)}.lv.open .lb2{display:block}
table.bx{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}table.bx th,table.bx td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}table.bx th{color:var(--mute);font-weight:500;font-size:11px}
table.bx th:first-child,table.bx td:first-child{text-align:left}table.bx tr.trk td:first-child{font-weight:700}
.ch2{display:inline-block;font-size:9.5px;font-weight:800;border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}.ch2.dd{background:var(--btn);color:var(--gold)}.ch2.td{background:var(--gold);color:#000}.ch2.w{background:#4a2c10;color:var(--gold)}
.prog{padding:8px 0;border-bottom:1px solid var(--line)}.prog:last-child{border:0}.pbar{height:6px;background:var(--btn);border-radius:3px;margin-top:5px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc)}.pbar.hit i{background:var(--good)}

</style>
</head>
<body>
<header><div class="hw">
  <div class="brand">NBA <b>TOP-3</b></div>
  <nav id="nav"></nav>
  <div class="who"><button class="inst" id="inst" style="display:none" onclick="installApp()">Install app</button><span id="meta"></span><span id="me"></span><button onclick="showLogin()">change</button></div>
</div></header>
<div class="wrap" id="wrap"><main id="app"></main><aside id="slipwrap"></aside></div>
<div id="modal"></div>

<script>
const $=s=>document.querySelector(s);
const TABS=[["today","Games"],["live","Live"],["picks","Friends' picks"],["bets","My bets"],["players","Players"]];
const NAMES={ATL:"Hawks",BOS:"Celtics",BKN:"Nets",CHA:"Hornets",CHI:"Bulls",CLE:"Cavaliers",DAL:"Mavericks",DEN:"Nuggets",DET:"Pistons",GS:"Warriors",HOU:"Rockets",IND:"Pacers",LAC:"Clippers",LAL:"Lakers",MEM:"Grizzlies",MIA:"Heat",MIL:"Bucks",MIN:"Timberwolves",NO:"Pelicans",NY:"Knicks",OKC:"Thunder",ORL:"Magic",PHI:"76ers",PHX:"Suns",POR:"Trail Blazers",SAC:"Kings",SA:"Spurs",TOR:"Raptors",UTAH:"Jazz",WSH:"Wizards"};
let tab=localStorage.tab&&TABS.some(t=>t[0]==localStorage.tab)?localStorage.tab:"today";
let slate=[],best=null,legs=[],playerId=null,meta={},calc=null,openGames=new Set(),filt={q:"",day:"all",start:false},slipMin=true,oddsManual=false,snaps={},alerts=[],live={};
const hdr=()=>({"Content-Type":"application/json","X-User":localStorage.user||"","X-Code":localStorage.code||""});
async function api(p,o={}){const r=await fetch("/api/"+p,{...o,headers:{...hdr(),...(o.headers||{})}});
  if(r.status==401){showLogin("That access code isn't right. Try again.");throw"auth"}
  if(!r.ok){const e=await r.json().catch(()=>({}));alert(e.detail||"Something went wrong");throw e}return r.json()}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b)});
function showLogin(msg){$("#modal").innerHTML=`<div class="modal"><form class="card" onsubmit="saveLogin(event)"><h2>Welcome</h2>${msg?`<p class="bad">${msg}</p>`:`<p class="mute">Enter your name (shown on your picks) and the access code you were given.</p>`}
  <label class="mute">Your name</label><input class="inp" id="ln" value="${esc(localStorage.user||"")}" autocomplete="nickname" style="margin:4px 0 10px">
  <label class="mute">Access code</label><input class="inp" id="lc" value="${esc(localStorage.code||"")}" autocomplete="off" style="margin:4px 0 14px"><button class="btn p" style="width:100%">Continue</button></form></div>`;setTimeout(()=>$("#ln").focus(),50)}
function saveLogin(e){e.preventDefault();const n=$("#ln").value.trim(),c=$("#lc").value.trim();if(n.length<2){return}localStorage.user=n;localStorage.code=c;location.reload()}
function needName(){if(!localStorage.user){showLogin();return false}return true}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=x=>x==null?"–":(x*100).toFixed(x<0.1?1:0)+"%";
const dec=p=>p>0.001?(1/p).toFixed(2):"–";
const logo=a=>`https://a.espncdn.com/i/teamlogos/nba/500/${a.toLowerCase()}.png`;
const face=id=>`https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;
const ini=n=>n.split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("");
const photo=(id,n,sz)=>`<span class="ph ${sz||""}" data-i="${esc(ini(n))}"><img src="${face(id)}" alt="" loading="lazy" onerror="this.remove()"></span>`;
const timeOf=s=>new Date(s).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const dayKey=s=>{const d=new Date(s),t=new Date(),tm=new Date(t.getTime()+864e5),k=x=>x.toDateString();return k(d)==k(t)?"Today":k(d)==k(tm)?"Tomorrow":d.toLocaleDateString([],{weekday:"long",day:"numeric",month:"short"})};
const statName={pts:"PTS",reb:"REB",ast:"AST",dd:"Double-double",td:"Triple-double"};
const money=x=>(x<0?"-":"")+"$"+Math.abs(x).toFixed(2);
const bkName=b=>b=="sportsbet"?"Sportsbet":(b||"");

function nav(){$("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
function go(t,pid){tab=t;localStorage.tab=t;if(pid)playerId=pid;nav();render();scrollTo(0,0)}
async function render(){const a=$("#app");a.innerHTML='<p class="mute">Loading…</p>';$("#wrap").classList.toggle("nos",tab!="today");
  clearInterval(liveTimer);try{await({today,live:liveTab,picks,bets,players})[tab](a)}catch(e){console.error(e)};drawSlip()}

/* ---------- finding players on the slate ---------- */
const findP=(g,pid)=>{for(const x of slate)if(x.game_id==g)for(const t of Object.values(x.teams))for(const p of t.players)if(p.player_id==pid)return p;return null};
const allPlayers=()=>slate.flatMap(g=>Object.values(g.teams).flatMap(t=>t.players));

/* ---------- bet slip ---------- */
const key=l=>[l.game_id,l.player_id,l.stat,l.line,l.side].join("|");
const legDesc=l=>["dd","td"].includes(l.stat)?statName[l.stat]:`Over ${l.line} ${statName[l.stat]}`;
function addLeg(l,quiet){const i=legs.findIndex(x=>key(x)==key(l));
  if(i>=0){if(!quiet)legs.splice(i,1)}else{legs=legs.filter(x=>!(x.game_id==l.game_id&&x.player_id==l.player_id&&x.stat==l.stat));legs.push(l);if(legs.length>6)legs.shift();
    const p=findP(l.game_id,l.player_id);if(p)snaps[l.player_id]={starting:p.starting,injury:(p.injury&&p.injury.status)||null}}}
function pick(g,pid,stat,line,price,book,prob,hit,n){const p=findP(g,pid);addLeg({game_id:g,player_id:pid,stat,line,side:"over",text:p?p.player:pid,price:price||null,book:book||null,p:prob,hit,n});
  oddsManual=false;calc=null;if(innerWidth>960)slipMin=false;paintSel();drawSlip();recalc()}
function paintSel(){const on=new Set(legs.map(key));document.querySelectorAll(".od[data-k]").forEach(b=>b.classList.toggle("on",on.has(b.dataset.k)))}
function estOdds(){return legs.length&&legs.every(l=>l.price)?legs.reduce((a,l)=>a*l.price,1):null}
let tmr;function recalc(){clearTimeout(tmr);tmr=setTimeout(async()=>{if(!legs.length){calc=null;drawSlip();return}
  const e=estOdds(),inp=$("#podds");let o=inp&&inp.value!==""?parseFloat(inp.value):(!oddsManual&&e?e:null);
  try{const r=await post("parlay",{legs:legs.map(({game_id,player_id,stat,line,side})=>({game_id,player_id,stat,line,side})),odds:o||null});calc={r,o:o||null};drawSlip()}catch(x){}},250)}
function drawSlip(){const w=$("#slipwrap");if(tab!="today"){w.innerHTML="";return}
  const fid=document.activeElement&&document.activeElement.id;

  const oddsVal=keep!==undefined&&keep!==""?keep:(!oddsManual&&e?e.toFixed(2):"");
  const mine=alerts.filter(a=>legs.some(l=>l.player_id==a.pid));
  w.innerHTML=`<div class="slip ${slipMin?"min":""}"><h2 onclick="slipMin=!slipMin;drawSlip()"><span>Bet slip <span class="badge">${legs.length}</span></span><span class="mute" style="font-weight:400">${r&&legs.length?pct(r.joint)+" win chance · "+(slipMin?"tap to open":"tap to close"):""}</span></h2><div class="sb">
  ${mine.map(a=>`<div class="alert"><span>⚠ ${esc(a.msg)}</span><a onclick="alerts=alerts.filter(x=>x!==alerts[${alerts.indexOf(a)}]);drawSlip()">dismiss</a></div>`).join("")}

  ${legs.length?`<div style="margin:10px 0"><div class="mute">Chance all legs win</div><div class="big">${r?pct(r.joint):"…"}</div>
   <div class="kv"><span class="mute">Fair odds</span><b>${r&&r.fair_odds?r.fair_odds.toFixed(2):"–"}</b></div>
   ${r&&legs.length>1?`<div class="kv"><span class="mute">If legs were unrelated</span><span>${pct(r.independent)}</span></div>`:""}</div>
   <label class="mute">Odds for this multi (decimal)${e&&!oddsManual?` — estimated from leg prices, check Sportsbet's real multi price`:""}</label><input class="inp" id="podds" type="number" step="0.01" min="1.01" placeholder="e.g. 3.60" value="${esc(oddsVal)}" oninput="oddsManual=true;recalc()" style="margin-top:4px">
   ${r&&r.value?`<div class="edge ${r.value.edge>0?"g":"b"}"><b>${r.value.edge>0?"+":""}${(r.value.edge*100).toFixed(1)} pts edge</b> · EV ${r.value.ev>=0?"+":""}${r.value.ev.toFixed(2)} per $1<br><span class="mute">${r.value.edge>0?"The model rates this higher than the price implies.":"The price is better than the model thinks. Consider skipping."}</span></div>`:""}
   <input class="inp" id="note" placeholder="Note for friends (optional)" style="margin:6px 0" value="${esc(note)}">
   <div style="display:flex;gap:6px"><input class="inp" id="stake" type="number" placeholder="Stake $" style="width:95px" value="${esc(stake)}"><button class="btn" style="flex:1" onclick="share()">Share pick</button><button class="btn p" style="flex:1" onclick="logBet()">Log bet</button></div>
   <p class="mute" style="margin:8px 0 0">Model edges are small. Log bets to see how it really performs.</p>`:""}
  </div></div>`;
  if(fid&&$("#"+fid)){const el=$("#"+fid);el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(x){}}}

async function pollStatus(){if(!legs.length)return;try{live=await api("status")}catch(e){return}
  for(const l of legs){const s=live[l.player_id],b=snaps[l.player_id];if(!s||!b)continue;
    const add=m=>{if(!alerts.some(a=>a.pid==l.player_id&&a.msg==m)){alerts.push({pid:l.player_id,msg:m});if(tab=="today")slipMin=false}};
    if(s.listed_out)add(`${s.player} is now listed OUT on the lineup page`);
    else if(s.injury&&s.injury!=b.injury&&s.injury!="Active")add(`${s.player} injury status changed to ${s.injury}`);
    if(b.starting&&!s.starting&&/Confirmed/i.test(s.lineup||""))add(`${s.player} is not in the confirmed starting five`);
    if(!b.starting&&s.starting){add(`${s.player} is now starting`);}
    snaps[l.player_id]={starting:s.starting,injury:s.injury}}
  drawSlip()}

function hitTxt(h,n){if(!n)return"";const c=h/n>=.8?"hg":h/n<=.3?"hb":"";return `<span class="${c}">${h}/${n}</span>`}
function btn(p,s,o){ // o: {line, prob, price, book, edge, hit, n}
  const val=o.price&&o.edge>=0.04;const k=[p.game_id,p.player_id,s,o.line,"over"].join("|");
  return `<button class="od ${val?"val":""}" data-k="${k}" onclick="pick('${p.game_id}','${p.player_id}','${s}',${o.line},${o.price||0},'${o.book||""}',${o.prob},${o.hit},${o.n})">${val?'<span class="vt">VALUE</span>':""}
   <div class="l">O ${o.line}${o.price?" · SB":""}</div><div class="o">${o.price?o.price.toFixed(2):dec(o.prob)}</div><div class="p">${pct(o.prob)} · ${hitTxt(o.hit,o.n)}</div></button>`}
function playerHTML(p){
  const mk=["pts","reb","ast"].map(s=>{let opts;const bk=p.book&&p.book[s];
    if(bk&&bk.length){opts=bk.map(b=>({line:b.line,prob:b.p_over,price:b.price,book:b.book,edge:b.edge,hit:b.hit,n:b.n}))
      .sort((a,b)=>Math.abs(a.line-p.proj[s])-Math.abs(b.line-p.proj[s])).slice(0,3).sort((a,b)=>a.line-b.line)}
    else{const lad=p.ladders[s];let i=lad.findIndex(x=>x.line>p.proj[s]);if(i<0)i=lad.length-1;
      opts=[lad[Math.max(0,i-1)],lad[i],lad[Math.min(lad.length-1,i+1)]].filter((x,j,a)=>a.findIndex(y=>y.line==x.line)==j).map(x=>({line:x.line,prob:x.p_over,hit:x.hit,n:x.n}))}
    return `<div class="lb">${s.toUpperCase()}</div>`+opts.map(o=>btn(p,s,o)).join("")+"<div></div>".repeat(Math.max(0,3-opts.length))}).join("");
  const dd=p.book&&p.book.dd,td=p.book&&p.book.td;
  const sp=(s,prob,b,h)=>{const val=b&&b.edge>=0.04;const k=[p.game_id,p.player_id,s,0,"over"].join("|");
    return `<button class="od ${val?"val":""}" data-k="${k}" onclick="pick('${p.game_id}','${p.player_id}','${s}',0,${b?b.price:0},'${b?b.book:""}',${prob},${h.k},${h.n})">${val?'<span class="vt">VALUE</span>':""}<span class="l" style="text-align:left">${statName[s]}</span><span><span class="o">${b?b.price.toFixed(2):dec(prob)}</span><span class="p">${pct(prob)} · ${hitTxt(h.k,h.n)}</span></span></button>`};
  const l10=p.last10||[],l5=l10.slice(0,5),av=k=>l5.length?(l5.reduce((a,x)=>a+x[k],0)/l5.length).toFixed(1):"–";
  const inj=p.injury&&p.injury.status&&p.injury.status!="Active"?`<span class="chip i">${esc(p.injury.status)}</span>`:"";
  return `<div class="pl"><div class="pt">${photo(p.player_id,p.player,"l")}<div style="min-width:0"><span class="pn" onclick="go('players','${p.player_id}')">${esc(p.player)}</span>${p.starting?'<span class="chip s">Starting</span>':'<span class="chip q">Bench / TBC</span>'}${inj}
   <div class="proj"><span>Proj <b>${p.proj.pts.toFixed(1)}</b> pts · <b>${p.proj.reb.toFixed(1)}</b> reb · <b>${p.proj.ast.toFixed(1)}</b> ast</span></div></div></div>
   <div class="mk">${mk}</div><div class="mk2">${sp("dd",p.p_dd,dd,p.dd_hit)}${sp("td",p.p_td,td,p.td_hit)}</div>
   ${l5.length?`<button class="l5t" onclick="const t=this.nextElementSibling;t.classList.toggle('open');this.textContent=t.classList.contains('open')?'Hide last 5 ▴':this.dataset.o" data-o="Last 5 · avg ${av("pts")} / ${av("reb")} / ${av("ast")} ▾">Last 5 · avg ${av("pts")} / ${av("reb")} / ${av("ast")} ▾</button>
   <div class="l5"><table><tr><th></th><th>PTS</th><th>REB</th><th>AST</th><th>MIN</th></tr>${l5.map(g=>`<tr><td>${g.home?"vs":"@"} ${g.opp}</td><td class="${g.pts>p.proj.pts+3?"hi":g.pts<p.proj.pts-5?"lo":""}">${g.pts}</td><td class="${g.reb>p.proj.reb+2?"hi":g.reb<p.proj.reb-2?"lo":""}">${g.reb}</td><td class="${g.ast>p.proj.ast+2?"hi":g.ast<p.proj.ast-2?"lo":""}">${g.ast}</td><td>${Math.round(g.min)}</td></tr>`).join("")}</table><div class="mute" style="font-size:11px">Green = well above today's projection, red = well below.</div></div>`:""}</div>`}
function gameHTML(g){const t=Object.values(g.teams),away=t.find(x=>!x.home)||t[0],home=t.find(x=>x.home)||t[1];
  const open=openGames.has(g.game_id),all=[...away.players,...home.players];
  const side=tm=>`<div><div class="th"><img src="${logo(tm.team)}" alt="">${NAMES[tm.team]||tm.team} <span>${esc(tm.lineup||"Lineup not posted")}</span></div>${tm.players.map(playerHTML).join("")}</div>`;
  return `<div class="game ${open?"open":""}" id="g${g.game_id}"><button class="gh" onclick="tg('${g.game_id}')">
   <div class="tm"><img src="${logo(away.team)}" alt=""><div><b>${NAMES[away.team]||away.team}</b><small>${away.team}</small></div></div>
   <div class="mid"><div class="t">${timeOf(g.start)}</div><div class="s">at</div></div>
   <div class="tm r"><div><b>${NAMES[home.team]||home.team}</b><small>${home.team}</small></div><img src="${logo(home.team)}" alt=""></div>
   <div class="av">${all.map(p=>photo(p.player_id,p.player)).join("")}</div><span class="chev">▾</span></button>
   <div class="gb"><div class="cols">${side(away)}${side(home)}</div></div></div>`}
function tg(id){const el=$("#g"+id);if(openGames.has(id))openGames.delete(id);else openGames.add(id);el.classList.toggle("open")}
function drawGames(){const q=filt.q.toLowerCase();let gs=slate.filter(g=>{
    if(filt.day!="all"&&dayKey(g.start)!=filt.day)return false;
    if(q){const txt=Object.values(g.teams).map(t=>t.team+" "+(NAMES[t.team]||"")+" "+t.players.map(p=>p.player).join(" ")).join(" ").toLowerCase();if(!txt.includes(q))return false}return true});
  if(filt.start)gs=gs.map(g=>({...g,teams:Object.fromEntries(Object.entries(g.teams).map(([k,t])=>[k,{...t,players:t.players.filter(p=>p.starting)}]))}));

  $("#glist").innerHTML=h||'<div class="empty">No games match.</div>';paintSel()}
function bestHTML(){if(!best||!best.combo.legs.length)return"";const c=best.combo;
  const L=l=>`<div class="bl">${photo(l.player_id,l.player)}<div class="x"><b>${esc(l.player)}</b><span class="mute">Over ${l.line} ${statName[l.stat]} · ${NAMES[l.team]||l.team}${l.starting?"":" · bench/TBC"}</span></div><div style="text-align:right"><b>${pct(l.p)}</b><div class="mute">hit ${l.hit}/${l.n}${l.price?` · ${l.price.toFixed(2)}`:""}</div></div></div>`;
  return `<div class="card best"><h2>⭐ Today's best picks</h2><p class="mute" style="margin:0 0 6px">A safe-ish multi: each leg is likely and has hit in most of the player's last 10 games.</p>
   ${c.legs.map(L).join("")}
   <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap"><div><span class="mute">All ${c.legs.length} win:</span> <b style="font-size:18px">${pct(c.joint)}</b> <span class="mute">· fair odds ${c.fair_odds?c.fair_odds.toFixed(2):"–"}</span></div>
   <button class="btn p" onclick="addBest()">Add to bet slip</button></div>
   ${best.legs.length>c.legs.length?`<details><summary>More safe legs (${best.legs.length})</summary><div class="pillrow">${best.legs.map((l,i)=>`<button class="sl" onclick="addBestLeg(${i})"><b>${esc(l.player)}</b><small>Over ${l.line} ${statName[l.stat]} · ${pct(l.p)} · ${l.hit}/${l.n}</small></button>`).join("")}</div></details>`:""}
   <details><summary>How are these picked?</summary><p class="mute">The model looks for legs it rates between about 62% and 86% likely, where the player also cleared that line in at least 7 of the last 10 games. It takes the highest such line (best payout), then combines legs from different players and games until the fair odds reach about 2.0 or there are 3 legs.</p></details></div>`}
function bestLeg(l){const p=findP(l.game_id,l.player_id);return {game_id:l.game_id,player_id:l.player_id,stat:l.stat,line:l.line,side:"over",text:l.player,price:l.price,book:null,p:l.p,hit:l.hit,n:l.n}}
function addBest(){best.combo.legs.forEach(l=>addLeg(bestLeg(l),true));oddsManual=false;calc=null;slipMin=false;paintSel();drawSlip();recalc()}
function addBestLeg(i){addLeg(bestLeg(best.legs[i]),true);oddsManual=false;calc=null;slipMin=false;paintSel();drawSlip();recalc()}
async function today(a){await loadSlate();api("best").then(b=>{best=b;const el=$("#bestbox");if(el)el.innerHTML=bestHTML()}).catch(()=>{});

  const days=[...new Set(slate.map(g=>dayKey(g.start)))];const o=meta.odds||{};
  const oddsNote=o.enabled?(o.remaining!=null?`Sportsbet prices are fetched once per game (${Math.round(o.remaining)} data credits left this month).`:"Fetching Sportsbet prices…"):"Prices shown are the model's fair odds. Connect an Odds API key to see Sportsbet prices.";
  a.innerHTML=`<div id="bestbox">${bestHTML()}</div><div class="tools"><input id="q" placeholder="Search team or player" value="${esc(filt.q)}" oninput="filt.q=this.value;drawGames()">
   <button class="pill ${filt.day=="all"?"on":""}" onclick="filt.day='all';render()">All</button>${days.map(d=>`<button class="pill ${filt.day==d?"on":""}" onclick="filt.day='${d}';render()">${d}</button>`).join("")}
   <button class="pill ${filt.start?"on":""}" onclick="filt.start=!filt.start;render()">Starters only</button>
   <button class="pill" onclick="slate.forEach(g=>openGames.add(g.game_id));drawGames()">Expand all</button><button class="pill" onclick="openGames.clear();drawGames()">Collapse all</button></div>
   <div class="note"><b>How to read a button:</b> the line, the price, then the model's chance and how many of the player's last games cleared it (e.g. 8/10). <b>SB</b> marks a real Sportsbet price; otherwise the price is the model's fair odds. A green <b style="color:var(--good)">VALUE</b> tag means the model rates it clearly more likely than the bookmaker's price implies. ${oddsNote}</div><div id="glist"></div>`;drawGames();pollStatus()}

   <details><summary>Safe picks vs risky picks</summary><p class="mute">Average model chance of each person's bets. A higher number means safer, more likely picks; a lower number means longer shots.</p><table class="t"><tr><th style="text-align:left">Name</th><th>Avg model chance</th></tr>${s.users.map(x=>`<tr><td style="text-align:left">${esc(x.user)}</td><td>${pct(x.avg_model_prob)}</td></tr>`).join("")}</table></details>`:'<p class="mute">Nobody has logged a bet yet.</p>'}</div>
  ${done.length?`<div class="card"><h2>Past bets</h2>${done.map(b=>{const l=JSON.parse(b.legs);return `<div class="bet">${l.map(x=>`<div>${legLine(x)}</div>`).join("")}<div class="mute">$${b.stake} at ${b.odds} · <b class="${b.result=="won"?"good":b.result=="lost"?"bad":""}">${b.result=="won"?"Won "+money(b.stake*b.odds-b.stake):b.result=="lost"?"Lost "+money(b.stake):"Refunded"}</b> <a href="#" style="color:var(--acc)" onclick="res(${b.id},'open');return false">undo</a></div></div>`}).join("")}</div>`:""}
  <div class="card"><h2>How good is the model?</h2><p>It beats a plain recent average by a small amount, which is normal for sports. Single games are very random, so don't expect it to be right every time. The real test is the leaderboard above, over many bets.</p>
   <details><summary>See the numbers</summary>
   <p class="mute">Test: the model learned from games before ${s.model.cut}, then predicted ${s.model.n_test.toLocaleString()} later games it had not seen. “Off by” is the average miss (lower is better).</p>

   ${["dd","td"].map(k=>`<h3>${k=="dd"?"Double-doubles":"Triple-doubles"}: when the model said…</h3><table class="t"><tr><th style="text-align:left">It said</th><th>Games</th><th>It happened</th></tr>${m[k].calibration.map(c=>`<tr><td style="text-align:left">about ${pct(c.pred)}</td><td>${c.n}</td><td>${pct(c.actual)}</td></tr>`).join("")}</table>`).join("")}

let pstat="pts",pline={},pdata=null;
async function players(a){
  a.innerHTML=`<div class="srch"><input class="inp" id="ps" placeholder="Search any player (e.g. Jokic)" oninput="psearch(this.value)" autocomplete="off"><div class="res" id="pres" style="display:none"></div></div><div id="pbody" style="margin-top:12px"></div>`;
  if(!playerId){await loadSlate();$("#pbody").innerHTML=`<div class="note">Pick a player to see how consistent they have been recently, or tap one playing tonight.</div>`+
     slate.map(g=>Object.values(g.teams).map(t=>`<div class="card"><div class="th"><img src="${logo(t.team)}" alt="">${NAMES[t.team]||t.team} <span>${NAMES[t.opp]?"vs "+NAMES[t.opp]:""}</span></div><div class="pillrow">${t.players.map(p=>`<button class="sl" onclick="go('players','${p.player_id}')"><div class="pt">${photo(p.player_id,p.player)}<div><b>${esc(p.player)}</b></div></div></button>`).join("")}</div></div>`).join("")).join("");return}
  pdata=await api("player/"+playerId);drawPlayer()}
let pst;function psearch(q){clearTimeout(pst);pst=setTimeout(async()=>{const r=$("#pres");if(q.trim().length<2){r.style.display="none";return}
  const rs=await api("players?q="+encodeURIComponent(q));r.innerHTML=rs.map(p=>`<div onclick="go('players','${p.player_id}')">${photo(p.player_id,p.player)}<span><b>${esc(p.player)}</b> <span class="mute">${p.team}</span></span></div>`).join("")||'<div class="mute">No match</div>';r.style.display="block"},200)}
function drawPlayer(){const d=pdata,g10=d.games.slice(0,10).reverse(),vals=g10.map(x=>x[pstat]);
  const avg=vals.reduce((a,b)=>a+b,0)/Math.max(1,vals.length);
  if(pline[pstat]==null)pline[pstat]=Math.max(0.5,Math.floor(avg)+0.5);const line=pline[pstat];
  const hits=vals.filter(v=>v>line).length,mx=Math.max(line,...vals,1)*1.12;
  const t=d.tonight,s=d.season,label={pts:"points",reb:"rebounds",ast:"assists"}[pstat];
  const verdict=hits>=8?"good":hits<=3?"bad":"";
  $("#pbody").innerHTML=`<div class="card"><div class="pt">${photo(playerId,d.player,"xl")}<div><h2 style="margin:0;font-size:20px">${esc(d.player)}</h2><div class="mute">${NAMES[d.team]||d.team} · this season: <b style="color:var(--ink)">${s.pts.toFixed(1)}</b> pts · <b style="color:var(--ink)">${s.reb.toFixed(1)}</b> reb · <b style="color:var(--ink)">${s.ast.toFixed(1)}</b> ast in ${s.games} games</div></div></div>
   ${t?`<div class="note" style="margin:12px 0 0">Playing ${t.home?"vs":"at"} ${NAMES[t.opp]||t.opp} at ${timeOf(t.start)}. Model projects <b style="color:var(--ink)">${t.proj.pts.toFixed(1)}</b> pts, <b style="color:var(--ink)">${t.proj.reb.toFixed(1)}</b> reb, <b style="color:var(--ink)">${t.proj.ast.toFixed(1)}</b> ast. <a href="#" style="color:var(--gold)" onclick="openGames.add('${t.game_id}');go('today');return false">See prices →</a></div>`:`<p class="mute" style="margin-bottom:0">Not on the current slate (not a top-3 player for their team, or no game soon).</p>`}</div>
   <div class="card"><h2>How consistent are they?</h2><p class="mute" style="margin:0 0 10px">Their last ${vals.length} games, oldest to newest. Green bars cleared the dashed line; red bars did not.</p>
   <div style="display:flex;gap:6px">${["pts","reb","ast"].map(k=>`<button class="pill ${pstat==k?"on":""}" onclick="pstat='${k}';drawPlayer()">${{pts:"Points",reb:"Rebounds",ast:"Assists"}[k]}</button>`).join("")}</div>
   <div class="bars">${g10.map(x=>`<div class="bar ${x[pstat]>line?"hit":""}"><b>${x[pstat]}</b><i style="height:${Math.max(2,x[pstat]/mx*100*0.78)}%"></i><span>${x.home?"vs ":"@"}${x.opp}</span></div>`).join("")}<div class="thr" style="bottom:calc(${line/mx*100*0.78}% + 17px)"></div></div>
   <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px"><div class="step"><button class="btn" onclick="pline[pstat]=Math.max(0.5,pline[pstat]-1);drawPlayer()">−</button><div><div class="mute" style="font-size:11px">Line</div><b style="font-size:18px">Over ${line}</b></div><button class="btn" onclick="pline[pstat]+=1;drawPlayer()">+</button></div>
   <div class="${verdict}" style="font-size:16px"><b>${hits} of ${vals.length}</b> games over ${line} ${label} <span class="mute">(${vals.length?Math.round(hits/vals.length*100):0}%)</span></div></div></div>
   <div class="card"><h2>Double-doubles and triple-doubles</h2><div class="tiles" style="margin:0"><div class="tile"><div class="v">${d.last20.dd}</div><div class="k">double-doubles in last 20</div></div><div class="tile"><div class="v">${d.last20.td}</div><div class="k">triple-doubles in last 20</div></div><div class="tile"><div class="v">${s.td}</div><div class="k">triple-doubles this season</div></div></div></div>
   <details class="card"><summary>Show full game log</summary><table class="t" style="margin-top:8px"><tr><th>Date</th><th>Opp</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th></tr>${d.games.map(g=>`<tr><td>${g.date}</td><td>${g.home?"vs":"@"} ${g.opp}</td><td>${Math.round(g.min)}</td><td>${g.pts}</td><td>${g.reb}</td><td>${g.ast}</td></tr>`).join("")}</table></details>`}


/* ---------- live scores ---------- */
let LG=[],boxes={},openLive=new Set(),fullStats=false,myOpen=[],liveTimer=null,showAll=new Set();
const stLabel=g=>g.state=="in"?(g.name=="STATUS_HALFTIME"?"Halftime":g.detail):g.state=="post"?g.detail:timeOf(g.start);
function catCount(r){return(r.pts>=10)+(r.reb>=10)+(r.ast>=10)}
function tag(r){const c=catCount(r);if(c>=3)return'<span class="ch2 td">TD</span>';
  if(c==2&&[r.pts,r.reb,r.ast].some(v=>v>=7&&v<10))return'<span class="ch2 w">TD WATCH</span>';if(c==2)return'<span class="ch2 dd">DD</span>';return""}
function boxHTML(g){const b=boxes[g.game_id];if(g.state=="pre")return'<p class="mute">Game has not started. Stats appear at tip-off.</p>';
  if(!b)return'<p class="mute">Loading stats…</p>';
  const sa=showAll.has(g.game_id);
  return `<div style="display:flex;gap:6px;margin:6px 0"><button class="pill ${fullStats?"on":""}" onclick="fullStats=!fullStats;drawLive()">More stats</button><button class="pill ${sa?"on":""}" onclick="showAll.has('${g.game_id}')?showAll.delete('${g.game_id}'):showAll.add('${g.game_id}');drawLive()">All players</button></div>`+
  b.teams.map(t=>{const rows=(sa?t.players:t.players.slice(0,8));
    return `<div class="th"><img src="${logo(t.team)}" alt="" style="width:22px;height:22px">${NAMES[t.team]||t.team}</div><div style="overflow-x:auto"><table class="bx"><tr><th>Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th>${fullStats?"<th>STL</th><th>BLK</th><th>3PM</th><th>TO</th><th>+/-</th>":""}</tr>
    ${rows.map(r=>{const trk=b.tracked&&b.tracked[r.player_id];return `<tr class="${trk?"trk":""}"><td>${trk?"⭐ ":""}${esc(r.player)}${tag(r)}${trk?`<div class="mute" style="font-size:10.5px;font-weight:400">proj ${trk.pts.toFixed(0)}/${trk.reb.toFixed(0)}/${trk.ast.toFixed(0)}</div>`:""}</td><td>${r.min}</td><td><b>${r.pts}</b></td><td>${r.reb}</td><td>${r.ast}</td>${fullStats?`<td>${r.stl}</td><td>${r.blk}</td><td>${r.fg3m}</td><td>${r.tov}</td><td>${r.pm>0?"+":""}${r.pm}</td>`:""}</tr>`}).join("")}</table></div>`}).join("")+'<div class="mute" style="font-size:11px">⭐ = our top-3 pick for that team, with the pre-game projection (pts/reb/ast).</div>'}
function liveHTML(g){const hw=g.home.score>g.away.score,aw=g.away.score>g.home.score,fin=g.state!="pre";
  const side=(t,w,r)=>`<div class="lt ${r?"r":""}">${r?"":`<img src="${logo(t.team)}" alt="">`}<div><div style="font-weight:700"><span class="nm">${NAMES[t.team]||t.team}</span><span class="ab">${t.team}</span></div><small>${t.record||""}</small></div>${fin?`<div class="sc ${w?"w":"l"}">${t.score}</div>`:""}${r?`<img src="${logo(t.team)}" alt="">`:""}</div>`;
  return `<div class="lv ${openLive.has(g.game_id)?"open":""}" id="lv${g.game_id}"><button class="lh" onclick="togLive('${g.game_id}')">${side(g.away,aw,false)}<div class="ls"><div class="st">${g.state=="in"?'<span class="live-dot"></span>':""}${esc(stLabel(g))}</div>${g.state=="pre"?'<div class="ft">tip-off</div>':g.state=="post"?"":'<div class="ft">LIVE</div>'}</div>${side(g.home,hw,true)}</button><div class="lb2">${openLive.has(g.game_id)?boxHTML(g):""}</div></div>`}
function legNow(l){const b=boxes[l.game_id];if(!b)return null;for(const t of b.teams){const r=t.players.find(p=>p.player_id==l.player_id);if(r)return r}return null}
function legProg(l){const g=LG.find(x=>x.game_id==l.game_id),r=legNow(l),name=esc(l.text||"");
  if(!g)return `<div class="prog"><b>${name}</b> <span class="mute">${legDesc(l)} · game not on today's scoreboard</span></div>`;
  if(g.state=="pre")return `<div class="prog"><b>${name}</b> <span class="mute">${legDesc(l)} · starts ${timeOf(g.start)}</span></div>`;
  if(!r)return `<div class="prog"><b>${name}</b> <span class="mute">${legDesc(l)} · has not played yet</span></div>`;
  let cur,tgt,hit,txt;
  if(l.stat=="dd"||l.stat=="td"){tgt=l.stat=="dd"?2:3;cur=catCount(r);hit=cur>=tgt;txt=`${cur} of ${tgt} categories at 10+ (PTS ${r.pts}, REB ${r.reb}, AST ${r.ast})`}
  else{cur=r[l.stat];tgt=l.line+0.5;hit=cur>l.line;txt=hit?`${cur} ${statName[l.stat]} – cleared`:`${cur} ${statName[l.stat]} – needs ${Math.ceil(tgt-cur)} more`}
  const done=g.state=="post",verdict=done?(hit?' <b class="good">✔ Won</b>':' <b class="bad">✖ Missed</b>'):"";
  return `<div class="prog"><div style="display:flex;justify-content:space-between;gap:8px"><span><b>${name}</b> <span class="mute">${legDesc(l)}</span></span><span>${txt}${verdict}</span></div><div class="pbar ${hit?"hit":""}"><i style="width:${Math.min(100,cur/tgt*100)}%"></i></div></div>`}
function myHTML(){const blocks=[];
  if(legs.length)blocks.push(`<div class="card"><h2>Your bet slip</h2>${legs.map(legProg).join("")}</div>`);
  myOpen.forEach(b=>{const l=JSON.parse(b.legs);blocks.push(`<div class="card"><h2>Your bet · $${b.stake} at ${b.odds}</h2>${l.map(legProg).join("")}</div>`)});
  return blocks.length?`<h3 style="margin-top:0">Your bets in play</h3>${blocks.join("")}`:""}
function togLive(id){if(openLive.has(id))openLive.delete(id);else openLive.add(id);refreshLive()}
function drawLive(){const el=$("#lbody");if(!el)return;
  const liveN=LG.filter(g=>g.state=="in").length;
  el.innerHTML=myHTML()+(LG.length?`<h3 ${myHTML()?"":'style="margin-top:0"'}>${liveN?`${liveN} game${liveN>1?"s":""} live now`:"Games"}</h3>`+LG.map(liveHTML).join(""):'<div class="card empty">No games on the scoreboard right now.</div>')}
async function refreshLive(){if(tab!="live")return;try{LG=await api("live")}catch(e){return}
  const ids=new Set(openLive);[...legs,...myOpen.flatMap(b=>JSON.parse(b.legs))].forEach(l=>ids.add(l.game_id));
  await Promise.all([...ids].filter(id=>LG.some(g=>g.game_id==id&&g.state!="pre")).map(async id=>{try{boxes[id]=await api("live/"+id)}catch(e){}}));
  if(tab=="live")drawLive()}
async function liveTab(a){a.innerHTML=`<div class="note">Scores and stats refresh by themselves every 20 seconds. Tap a game for the box score. Stats from ESPN; ⭐ marks the model's top-3 players.</div><div id="lbody"><p class="mute">Loading…</p></div>`;
  try{const sc=await api("scorecard");myOpen=sc.bets.filter(b=>b.user==localStorage.user&&b.result=="open")}catch(e){myOpen=[]}
  await refreshLive();liveTimer=setInterval(refreshLive,20000)}

/* ---------- install as app ---------- */
let deferred=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#inst").style.display="inline-block"});
async function installApp(){if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("#inst").style.display="none"}
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
const ios=/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone;
if(ios&&!localStorage.iosHint){setTimeout(()=>{if(confirm("Tip: to install this as an app, tap the Share button, then “Add to Home Screen”.\n\nShow this tip again?")===false)localStorage.iosHint=1},2500)}

(async()=>{$("#me").textContent=localStorage.user||"";nav();
  if(!localStorage.user){showLogin()}
  try{meta=await api("meta");$("#meta").textContent=`Data to ${meta.data_through}`}catch(e){}
  render()})();
</script>
</body>
