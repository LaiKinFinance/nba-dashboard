.chip.b{background:var(--c-pur-bg);color:var(--c-pur-fg)}.chip.f{background:var(--c-warn-bg);color:var(--c-warn-fg)}
.vb{border-color:var(--val-line);background:linear-gradient(180deg,var(--val-bg),var(--card) 70%)}.conf{display:inline-block;border-radius:4px;padding:1px 7px;font-size:10.5px;font-weight:800;text-transform:uppercase}.conf.Strong{background:var(--c-good-bg);color:var(--c-good-fg)}.conf.Medium{background:var(--c-gold-bg);color:var(--c-gold-fg)}.conf.Speculative{background:var(--btn);color:var(--mute)}
.why{font-size:12.5px;color:var(--mute);margin:6px 0 0;padding-left:18px}.why li{margin:2px 0}.why b{color:var(--ink)}
.newb{background:var(--acc);color:#fff;border-radius:4px;padding:0 5px;font-size:9.5px;font-weight:800;margin-left:4px}
.mnp{margin-top:8px;font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.lv{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.lh{display:flex;align-items:center;gap:8px;padding:12px;width:100%;background:none;border:0;text-align:left;cursor:pointer}.lh:hover{background:var(--card2)}
.lt{flex:1 1 0;display:flex;align-items:center;gap:10px;min-width:0}.lt.r{justify-content:flex-end;text-align:right}.lt img{width:38px;height:38px;object-fit:contain;flex:none}
.lt .sc{font-size:28px;font-weight:800;line-height:1}.lt .sc.w{color:var(--sc-w)}.lt .sc.l{color:var(--mute);font-weight:600}.lt small{display:block;color:var(--mute);font-size:11.5px}
.ls{text-align:center;flex:none;min-width:84px}.ls .st{font-size:12.5px;font-weight:700}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:5px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}.ls .ft{color:var(--mute)}.ab{display:none}
@media(max-width:640px){.nm{display:none}.ab{display:inline}.lt{gap:6px}.lt img{width:30px;height:30px}.lt .sc{font-size:23px}.ls{min-width:78px}.lh{padding:10px 8px;gap:4px}}
.lb2{display:none;border-top:1px solid var(--line);padding:6px 12px 12px;background:var(--bg2)}.lv.open .lb2{display:block}
table.bx{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}table.bx th,table.bx td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}table.bx th{color:var(--mute);font-weight:500;font-size:11px}
table.bx th:first-child,table.bx td:first-child{text-align:left}table.bx tr.trk td:first-child{font-weight:700}table.ls2 td.qw{color:var(--ink);font-weight:700}table.ls2 td{color:var(--mute)}table.ls2 td:last-child{color:var(--ink)}table.ls2 td:first-child{color:var(--ink)}
.ch2{display:inline-block;font-size:9.5px;font-weight:800;border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}.ch2.dd{background:var(--btn);color:var(--c-warn-fg)}.ch2.td{background:var(--gold);color:#000}.ch2.w{background:var(--c-warn-bg);color:var(--c-warn-fg)}
.prog{padding:8px 0;border-bottom:1px solid var(--line)}.prog:last-child{border:0}.pbar{height:6px;background:var(--btn);border-radius:3px;margin-top:5px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc)}.pbar.hit i{background:var(--good)}

</style>

<body>
<header><div class="hw">
  <div class="brand" style="display:flex;align-items:center;gap:9px"><img src="/icon-v2-192.png" alt="" style="width:30px;height:30px;border-radius:7px">NBA <b>TOP-3</b></div>
  <nav id="nav"></nav>
  <div class="who"><button id="thm" onclick="toggleTheme()" title="Switch light / dark theme"></button><button class="inst" id="inst" style="display:none" onclick="installApp()">Install app</button><span id="meta"></span><span id="me"></span><button onclick="showLogin()">change</button></div>
</div></header>
<div class="wrap" id="wrap"><main id="app"></main><aside id="slipwrap"></aside></div>
<div id="modal"></div>

<script>
const $=s=>document.querySelector(s);
const TABS=[["today","Games"],["best","Best picks"],["live","Live"],["lineups","Lineups"],["picks","Friends' picks"],["bets","My bets"],["players","Players"]];
const NAMES={ATL:"Hawks",BOS:"Celtics",BKN:"Nets",CHA:"Hornets",CHI:"Bulls",CLE:"Cavaliers",DAL:"Mavericks",DEN:"Nuggets",DET:"Pistons",GS:"Warriors",HOU:"Rockets",IND:"Pacers",LAC:"Clippers",LAL:"Lakers",MEM:"Grizzlies",MIA:"Heat",MIL:"Bucks",MIN:"Timberwolves",NO:"Pelicans",NY:"Knicks",OKC:"Thunder",ORL:"Magic",PHI:"76ers",PHX:"Suns",POR:"Trail Blazers",SAC:"Kings",SA:"Spurs",TOR:"Raptors",UTAH:"Jazz",WSH:"Wizards"};
let tab=localStorage.tab&&TABS.some(t=>t[0]==localStorage.tab)?localStorage.tab:"today";
let slate=[],best=null,legs=[],playerId=null,meta={},calc=null,openGames=new Set(),filt={q:"",day:"all",start:false},slipMin=true,oddsManual=false,snaps={},alerts=[],live={};
const hdr=()=>({"Content-Type":"application/json","X-User":localStorage.user||"","X-Code":localStorage.code||""});
async function api(p,o={}){const r=await fetch("/api/"+p,{...o,headers:{...hdr(),...(o.headers||{})}});
  if(r.status==401){showLogin("That access code isn't right. Try again.");throw"auth"}
  if(!r.ok){const e=await r.json().catch(()=>({}));alert(e.detail||"Something went wrong");throw e}return r.json()}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b)});
function showLogin(msg){$("#modal").innerHTML=`<div class="modal"><form class="card" onsubmit="saveLogin(event)"><h2>Welcome</h2>${msg?`<p class="bad">${msg}</p>`:`<p class="mute">Enter your name (shown on your picks) and the access code you were given.</p>`}
  <label class="mute">Your name</label><input class="inp" id="ln" value="${esc(localStorage.user||"")}" autocomplete="nickname" style="margin:4px 0 10px">
  <label class="mute">Access code</label><input class="inp" id="lc" value="${esc(localStorage.code||"")}" autocomplete="off" style="margin:4px 0 14px"><button class="btn p" style="width:100%">Continue</button></form></div>`;setTimeout(()=>$("#ln").focus(),50)}
function saveLogin(e){e.preventDefault();const n=$("#ln").value.trim(),c=$("#lc").value.trim();if(n.length<2){return}localStorage.user=n;localStorage.code=c;location.reload()}
function needName(){if(!localStorage.user){showLogin();return false}return true}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=x=>x==null?"–":(x*100).toFixed(x<0.1?1:0)+"%";
const dec=p=>p>0.001?(1/p).toFixed(2):"–";
const logo=a=>`https://a.espncdn.com/i/teamlogos/nba/500/${a.toLowerCase()}.png`;
const face=id=>`https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;
const ini=n=>n.split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("");
const photo=(id,n,sz)=>`<span class="ph ${sz||""}" data-i="${esc(ini(n))}"><img src="${face(id)}" alt="" loading="lazy" onerror="this.remove()"></span>`;
const timeOf=s=>new Date(s).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const dayKey=s=>{const d=new Date(s),t=new Date(),tm=new Date(t.getTime()+864e5),k=x=>x.toDateString();return k(d)==k(t)?"Today":k(d)==k(tm)?"Tomorrow":d.toLocaleDateString([],{weekday:"long",day:"numeric",month:"short"})};
const statName={pts:"PTS",reb:"REB",ast:"AST",fg3m:"3PM",stl:"STL",blk:"BLK",pra:"Pts+Reb+Ast",pr:"Pts+Reb",pa:"Pts+Ast",dd:"Double-double",td:"Triple-double"};
const BK={sportsbet:"SB",tab:"TAB",ladbrokes_au:"LAD",ladbrokes:"LAD",neds:"NEDS",pointsbet_au:"PB",pointsbet:"PB",betfair_ex_au:"BF",unibet:"UNI",bet365_au:"B365",playup:"PLAY",betr_au:"BETR",boombet:"BOOM",dabble_au:"DAB",tabtouch:"TT"};
const bk=b=>BK[b]||String(b||"").slice(0,4).toUpperCase();
const money=x=>(x<0?"-":"")+"$"+Math.abs(x).toFixed(2);
const bkName=b=>b=="sportsbet"?"Sportsbet":(b||"");

function nav(){$("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
function go(t,pid){tab=t;localStorage.tab=t;if(pid)playerId=pid;else if(t=='players')playerId=null;nav();render();scrollTo(0,0)}
async function render(){const a=$("#app");a.innerHTML='<p class="mute">Loading…</p>';$("#wrap").classList.toggle("nos",!SLIPTABS.includes(tab));
  clearInterval(liveTimer);try{await({today,best:bestTab,live:liveTab,lineups:lineupsTab,picks,bets,players})[tab](a)}catch(e){console.error(e)};drawSlip()}

/* ---------- finding players on the slate ---------- */
const findP=(g,pid)=>{for(const x of slate)if(x.game_id==g)for(const t of Object.values(x.teams))for(const p of t.players)if(p.player_id==pid)return p;return null};
const allPlayers=()=>slate.flatMap(g=>Object.values(g.teams).flatMap(t=>t.players));

/* ---------- bet slip ---------- */
const key=l=>[l.game_id,l.player_id||"",l.stat,l.line,l.side,l.team||"",l.lo||""].join("|");
const grp=x=>x=="ml"||x=="spread"||x=="band"?"side":x=="total"||x=="tt"?"total":null;
const sgn=x=>x>0?"+"+x:""+x;
const legDesc=l=>esc(l.stat=="ml"?"To win":l.stat=="spread"?`Handicap ${sgn(l.side=="home"?l.line:-l.line)}`:l.stat=="total"?`${l.side=="over"?"Over":"Under"} ${l.line} total points`:l.stat=="tt"?`Team total ${l.side} ${l.line}`:l.stat=="band"?`Win by ${l.hi?l.lo+"–"+l.hi:l.lo+"+"}`:["dd","td"].includes(l.stat)?statName[l.stat]:`Over ${l.line} ${statName[l.stat]}`);
function addLeg(l,quiet){const i=legs.findIndex(x=>key(x)==key(l));
  if(i>=0){if(!quiet)legs.splice(i,1)}else{
    legs=legs.filter(x=>grp(l.stat)?!(x.game_id==l.game_id&&grp(x.stat)==grp(l.stat)):!(x.game_id==l.game_id&&x.player_id==l.player_id&&x.stat==l.stat));
    legs.push(l);if(legs.length>6)legs.shift();
    const p=l.player_id&&findP(l.game_id,l.player_id);if(p)snaps[l.player_id]={starting:p.starting,injury:(p.injury&&p.injury.status)||null}}}
function pickTeam(g,stat,side,line,price,book,prob,text,team,lo,hi){addLeg({game_id:g,stat,line,side,text,price:price||null,book:book||null,p:prob,team:team||undefined,lo:lo||undefined,hi:hi||undefined});oddsManual=false;calc=null;if(innerWidth>960)slipMin=false;paintSel();drawSlip();recalc()}
function pick(g,pid,stat,line,price,book,prob,hit,n){const p=findP(g,pid);addLeg({game_id:g,player_id:pid,stat,line,side:"over",text:p?p.player:pid,price:price||null,book:book||null,p:prob,hit,n});
  oddsManual=false;calc=null;if(innerWidth>960)slipMin=false;paintSel();drawSlip();recalc()}
function paintSel(){const on=new Set(legs.map(key));document.querySelectorAll(".od[data-k]").forEach(b=>b.classList.toggle("on",on.has(b.dataset.k)))}
function estOdds(){return legs.length&&legs.every(l=>l.price)?legs.reduce((a,l)=>a*l.price,1):null}
let tmr;function recalc(){clearTimeout(tmr);tmr=setTimeout(async()=>{if(!legs.length){calc=null;drawSlip();return}
  const e=estOdds(),inp=$("#podds");let o=oddsManual&&inp&&inp.value!==""?parseFloat(inp.value):(e||null);
  try{const r=await post("parlay",{legs:legs.map(({game_id,player_id,stat,line,side,team,lo,hi})=>({game_id,player_id,stat,line,side,team,lo,hi})),odds:o||null});calc={r,o:o||null};drawSlip()}catch(x){}},250)}
const SLIPTABS=["today","best"];
function drawSlip(){const w=$("#slipwrap");if(!SLIPTABS.includes(tab)){w.innerHTML="";return}
  const fid=document.activeElement&&document.activeElement.id;
  const keep=($("#podds")||{}).value,stake=($("#stake")||{}).value||"",note=($("#note")||{}).value||"";const r=calc&&calc.r,e=estOdds();
  const oddsVal=oddsManual&&keep!==undefined&&keep!==""?keep:(e?e.toFixed(2):"");
  const mine=alerts.filter(a=>legs.some(l=>l.player_id==a.pid));
  w.innerHTML=`<div class="slip ${slipMin?"min":""}"><h2 onclick="slipMin=!slipMin;drawSlip()"><span>Bet slip <span class="badge">${legs.length}</span></span><span class="mute" style="font-weight:400">${r&&legs.length?pct(r.joint)+" win chance · "+(slipMin?"tap to open":"tap to close"):""}</span></h2><div class="sb">
  ${mine.map(a=>`<div class="alert"><span>⚠ ${esc(a.msg)}</span><a onclick="alerts=alerts.filter(x=>x!==alerts[${alerts.indexOf(a)}]);drawSlip()">dismiss</a></div>`).join("")}
  ${legs.length?legs.map((l,i)=>`<div class="lg"><div>${esc(l.text)}<small>${legDesc(l)}${l.price?` · ${l.price.toFixed(2)} ${bkName(l.book)}`:""}${r&&r.legs[i]?` · model ${pct(r.legs[i].p)}`:""}</small></div><a onclick="legs.splice(${i},1);calc=null;paintSel();drawSlip();recalc()">×</a></div>`).join(""):'<p class="mute">Tap any price to add a leg. Aim for 2–3 legs.</p>'}
  ${legs.length?`<div style="margin:10px 0"><div class="mute">Chance all legs win</div><div class="big">${r?pct(r.joint):"…"}</div>
   <div class="kv"><span class="mute">Fair odds</span><b>${r&&r.fair_odds?r.fair_odds.toFixed(2):"–"}</b></div>
   ${r&&legs.length>1?`<div class="kv"><span class="mute">If legs were unrelated</span><span>${pct(r.independent)}</span></div>`:""}</div>
   <label class="mute">Odds for this multi (decimal)${e&&!oddsManual?` — estimated from leg prices, check Sportsbet's real multi price`:""}</label><input class="inp" id="podds" type="number" step="0.01" min="1.01" placeholder="e.g. 3.60" value="${esc(oddsVal)}" oninput="oddsManual=true;recalc()" style="margin-top:4px">
   ${r&&r.value?`<div class="edge ${r.value.edge>0?"g":"b"}"><b>${r.value.edge>0?"+":""}${(r.value.edge*100).toFixed(1)} pts edge</b> · EV ${r.value.ev>=0?"+":""}${r.value.ev.toFixed(2)} per $1<br><span class="mute">${r.value.edge>0?"The model rates this higher than the price implies.":"The price is better than the model thinks. Consider skipping."}</span></div>`:""}
   ${r&&r.warning?`<div class="note" style="margin:8px 0">${esc(r.warning)}</div>`:""}
   <input class="inp" id="note" placeholder="Note for friends (optional)" style="margin:6px 0" value="${esc(note)}">
   <div style="display:flex;gap:6px"><input class="inp" id="stake" type="number" placeholder="Stake $" style="width:95px" value="${esc(stake)}"><button class="btn" style="flex:1" onclick="share()">Share pick</button><button class="btn p" style="flex:1" onclick="logBet()">Log bet</button></div>
   <p class="mute" style="margin:8px 0 0">Model edges are small. Log bets to see how it really performs.</p>`:""}
  </div></div>`;
  if(fid&&$("#"+fid)){const el=$("#"+fid);el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(x){}}}
const legsPayload=()=>legs.map(l=>({game_id:l.game_id,player_id:l.player_id,stat:l.stat,line:l.line,side:l.side,team:l.team,lo:l.lo,hi:l.hi,text:l.text}));
async function share(){if(!needName()||!calc)return;await post("picks",{legs:legsPayload(),note:$("#note").value,odds:calc.o,model_prob:calc.r.joint});legs=[];calc=null;go("picks")}
async function logBet(){if(!needName())return;const s=parseFloat($("#stake").value);if(!s||!calc||!calc.o){alert("Enter the odds and your stake first");return}
  await post("bets",{legs:legsPayload(),stake:s,odds:calc.o,model_prob:calc.r.joint});legs=[];calc=null;go("bets")}

/* ---------- live lineup/injury alerts ---------- */
async function pollStatus(){if(!legs.length)return;try{live=await api("status")}catch(e){return}
  for(const l of legs){const s=live[l.player_id],b=snaps[l.player_id];if(!s||!b)continue;
    const add=m=>{if(!alerts.some(a=>a.pid==l.player_id&&a.msg==m)){alerts.push({pid:l.player_id,msg:m});if(tab=="today")slipMin=false}};
    if(s.listed_out)add(`${s.player} is now listed OUT on the lineup page`);
    else if(s.injury&&s.injury!=b.injury&&s.injury!="Active")add(`${s.player} injury status changed to ${s.injury}`);
    if(b.starting&&!s.starting&&/Confirmed/i.test(s.lineup||""))add(`${s.player} is not in the confirmed starting five`);
    if(!b.starting&&s.starting){add(`${s.player} is now starting`);}
    snaps[l.player_id]={starting:s.starting,injury:s.injury}}
  drawSlip()}
setInterval(pollStatus,180000);

/* ---------- games tab ---------- */
async function loadSlate(){slate=await api("slate")}
function hitTxt(h,n){if(!n)return"";const c=h/n>=.8?"hg":h/n<=.3?"hb":"";return `<span class="${c}">${h}/${n}</span>`}
function btn(p,s,o){ // o: {line, prob, price, book, edge, hit, n}
  const val=o.price&&o.edge>=0.04,bst=(o.boost||0)>=0.05,fad=!bst&&(o.fade||0)<=-0.05;const k=key({game_id:p.game_id,player_id:p.player_id,stat:s,line:o.line,side:"over"});
  return `<button class="od ${val?"val":""} ${bst?"bst":""} ${fad?"fad":""}" data-k="${k}" data-p="${o.prob}" onclick="pick('${p.game_id}','${p.player_id}','${s}',${o.line},${o.price||0},'${o.book||""}',${o.prob},${o.hit},${o.n})">${val?'<span class="vt">VALUE</span>':""}${bst?'<span class="bt">BOOST</span>':fad?'<span class="ft">FADE</span>':""}${o.alt?`<span class="alt">${bk(o.alt[1])} ${o.alt[0].toFixed(2)}</span>`:""}
   <div class="l">O ${o.line}${o.price?" · "+bk(o.book):""}</div><div class="o">${o.price?o.price.toFixed(2):dec(o.prob)}</div><div class="p">${pct(o.prob)} · ${hitTxt(o.hit,o.n)}</div></button>`}
function whyHTML(p){const ab=p.absent||[],ev=p.evidence||[];if(!ab.length)return"";
  const full=p.proj_full||{},d=k=>(p.proj[k]-(full[k]??p.proj[k]));const dtxt=["pts","reb","ast"].map(k=>`${d(k)>=0?"+":""}${d(k).toFixed(1)} ${k}`).join(", ");
  return `<details class="why-d"><summary style="font-size:12px;color:var(--c-pur-fg)">Why the change? ${ab.length} teammate${ab.length>1?"s":""} out</summary><ul class="why">`+
   ab.map(a=>`<li><b>${esc(a.name)}</b> (${a.pts.toFixed(1)} pts, ${a.reb.toFixed(1)} reb, ${a.ast.toFixed(1)} ast) – ${a.weight>=0.85?"out":"questionable"}</li>`).join("")+
   `<li>Model effect vs a full-strength roster: <b>${dtxt}</b></li>`+
   ev.map(e=>`<li>Without ${esc(e.who)}: <b>${e.without.pts.toFixed(1)}</b> pts / ${e.without.reb.toFixed(1)} reb / ${e.without.ast.toFixed(1)} ast in ${e.without.n} games, vs ${e.with_.pts.toFixed(1)} / ${e.with_.reb.toFixed(1)} / ${e.with_.ast.toFixed(1)} in ${e.with_.n} with him</li>`).join("")+
   (ev.length?"":`<li>Not enough games with and without this teammate for a direct comparison; the estimate comes from how all players on all teams responded to similar absences.</li>`)+`</ul></details>`}
function statRow(p,st,lab){const L=(p.strip&&p.strip[st])||[];if(!L.length)return"";
  const core=["pts","reb","ast"].includes(st),thr={pts:1,reb:.6,ast:.6}[st],effB=core?p.proj[st]-((p.proj_full||p.proj)[st]):0,effF=core?p.proj[st]-((p.proj_base||p.proj)[st]):0;   // BOOST/FADE only when the stat-level effect is meaningful
  return `<div class="mkr"><div class="lb">${lab}</div><div class="stw"><div class="strip">${L.map(o=>{const rel=o.p_over>=.3&&o.p_over<=.75;return btn(p,st,{line:o.line,prob:o.p_over,price:o.price,book:o.book,alt:o.alt,edge:o.edge,hit:o.hit,n:o.n,boost:(core&&rel&&effB>=thr)?o.boost:0,fade:(core&&rel&&effF<=-thr)?o.fade:0})}).join("")}</div></div></div>`}
function moreHTML(p){const defs=[["pra","PRA"],["pr","P+R"],["pa","P+A"],["fg3m","3PM"],["stl","STL"],["blk","BLK"]].filter(([s])=>((p.strip||{})[s]||[]).length);if(!defs.length)return"";
  const low=defs.some(d=>d[0]=="stl"||d[0]=="blk");
  return `<details class="more"><summary>More markets: ${defs.map(d=>d[1]).join(", ")}</summary>${defs.map(([s,l])=>statRow(p,s,l)).join("")}${low?'<div class="mute" style="font-size:11px;margin-top:4px">Steals and blocks: in testing our model was no better than a plain average, so treat those as low-confidence.</div>':""}</details>`}
function playerHTML(p){
  const mk=["pts","reb","ast"].map(st=>statRow(p,st,st.toUpperCase())).join("");
  const dd=p.book&&p.book.dd,td=p.book&&p.book.td;
  const sp=(s,prob,b,h)=>{const val=b&&b.edge>=0.04;const k=key({game_id:p.game_id,player_id:p.player_id,stat:s,line:0,side:"over"}),hist=p.dd_td_hist||{};

    ${rows.map(r=>{const trk=b.tracked&&b.tracked[r.player_id];return `<tr class="${trk?"trk":""}"><td>${trk?"⭐ ":""}${esc(r.player)}${tag(r)}${trk?`<div class="mute" style="font-size:10.5px;font-weight:400">proj ${trk.pts.toFixed(0)}/${trk.reb.toFixed(0)}/${trk.ast.toFixed(0)}</div>`:""}</td><td>${r.min}</td><td><b>${r.pts}</b></td><td>${r.reb}</td><td>${r.ast}</td><td>${r.fg3m}</td><td>${r.stl}</td><td>${r.blk}</td>${fullStats?`<td>${esc(r.fg)}</td><td>${r.tov}</td><td>${r.pm>0?"+":""}${r.pm}</td>`:""}</tr>`}).join("")}</table></div>`}).join("")+'<div class="mute" style="font-size:11px">⭐ = our top-3 pick for that team, with the pre-game projection (pts/reb/ast).</div>'}
function liveHTML(g){const hw=g.home.score>g.away.score,aw=g.away.score>g.home.score,fin=g.state!="pre";
  const side=(t,w,r)=>`<div class="lt ${r?"r":""}">${r?"":`<img src="${logo(t.team)}" alt="">`}<div><div style="font-weight:700"><span class="nm">${NAMES[t.team]||t.team}</span><span class="ab">${t.team}</span></div><small>${t.record||""}</small></div>${fin?`<div class="sc ${w?"w":"l"}">${t.score}</div>`:""}${r?`<img src="${logo(t.team)}" alt="">`:""}</div>`;
  return `<div class="lv ${openLive.has(g.game_id)?"open":""}" id="lv${g.game_id}"><button class="lh" onclick="togLive('${g.game_id}')">${side(g.away,aw,false)}<div class="ls"><div class="st">${g.state=="in"?'<span class="live-dot"></span>':""}${esc(stLabel(g))}</div>${g.state=="pre"?'<div class="ft">tip-off</div>':g.state=="post"?"":'<div class="ft">LIVE</div>'}</div>${side(g.home,hw,true)}</button><div class="lb2">${openLive.has(g.game_id)?lineScore(g)+boxHTML(g):""}</div></div>`}
function legNow(l){const b=boxes[l.game_id];if(!b)return null;for(const t of b.teams){const r=t.players.find(p=>p.player_id==l.player_id);if(r)return r}return null}
function teamProg(l){const g=LG.find(x=>x.game_id==l.game_id),name=esc(l.text||"");
  if(!g)return `<div class="prog"><b>${name}</b> <span class="mute">${legDesc(l)} · game not on today's scoreboard</span></div>`;
  if(g.state=="pre")return `<div class="prog"><b>${name}</b> <span class="mute">${legDesc(l)} · starts ${timeOf(g.start)}</span></div>`;
  const hm=g.home.score-g.away.score,tot=g.home.score+g.away.score;let hit,txt,frac;
  if(l.stat=="ml"){const m=l.side=="home"?hm:-hm;hit=m>0;txt=m==0?"Tied":`${m>0?"Leading":"Trailing"} by ${Math.abs(m)}`;frac=.5+m/40}
  else if(l.stat=="spread"){const m=(l.side=="home"?hm:-hm)+(l.side=="home"?l.line:-l.line);hit=m>0;txt=`${m>0?"Covering by":"Behind the line by"} ${Math.abs(m)}`;frac=.5+m/40}
  else if(l.stat=="tt"){const pts=l.team=="home"?g.home.score:g.away.score;hit=l.side=="over"?pts>l.line:pts<l.line;txt=`${pts} points so far (line ${Number(l.line)})`;frac=l.side=="over"?pts/l.line:1-(pts-l.line*.5)/(l.line*.5)}
  else if(l.stat=="band"){const m=l.team=="home"?hm:-hm;hit=m>=l.lo&&(l.hi==null||m<=l.hi);txt=m>0?`Leading by ${m}`:m<0?`Trailing by ${-m}`:"Tied";frac=hit?1:.15}
  else{hit=l.side=="over"?tot>l.line:tot<l.line;txt=`${tot} points so far (line ${Number(l.line)})`;frac=l.side=="over"?tot/l.line:1-(tot-l.line*.5)/(l.line*.5)}
  const done=g.state=="post",v=done?(hit?' <b class="good">✔ Won</b>':' <b class="bad">✖ Missed</b>'):"";
  return `<div class="prog"><div style="display:flex;justify-content:space-between;gap:8px"><span><b>${name}</b> <span class="mute">${legDesc(l)}</span></span><span>${txt}${v}</span></div><div class="pbar ${hit?"hit":""}"><i style="width:${Math.max(2,Math.min(100,frac*100))}%"></i></div></div>`}
function legProg(l){if(["ml","spread","total","tt","band"].includes(l.stat))return teamProg(l);const g=LG.find(x=>x.game_id==l.game_id),r=legNow(l),name=esc(l.text||"");
  if(!g)return `<div class="prog"><b>${name}</b> <span class="mute">${legDesc(l)} · game not on today's scoreboard</span></div>`;
  if(g.state=="pre")return `<div class="prog"><b>${name}</b> <span class="mute">${legDesc(l)} · starts ${timeOf(g.start)}</span></div>`;
  if(!r)return `<div class="prog"><b>${name}</b> <span class="mute">${legDesc(l)} · has not played yet</span></div>`;
  let cur,tgt,hit,txt;
  if(l.stat=="dd"||l.stat=="td"){tgt=l.stat=="dd"?2:3;cur=catCount(r);hit=cur>=tgt;txt=`${cur} of ${tgt} categories at 10+ (PTS ${r.pts}, REB ${r.reb}, AST ${r.ast})`}
  else{cur=r[l.stat];tgt=l.line+0.5;hit=cur>l.line;txt=hit?`${cur} ${statName[l.stat]} – cleared`:`${cur} ${statName[l.stat]} – needs ${Math.ceil(tgt-cur)} more`}
  const done=g.state=="post",verdict=done?(hit?' <b class="good">✔ Won</b>':' <b class="bad">✖ Missed</b>'):"";
  return `<div class="prog"><div style="display:flex;justify-content:space-between;gap:8px"><span><b>${name}</b> <span class="mute">${legDesc(l)}</span></span><span>${txt}${verdict}</span></div><div class="pbar ${hit?"hit":""}"><i style="width:${Math.min(100,cur/tgt*100)}%"></i></div></div>`}
function myHTML(){const blocks=[];
  if(legs.length)blocks.push(`<div class="card"><h2>Your bet slip</h2>${legs.map(legProg).join("")}</div>`);
  myOpen.forEach(b=>{const l=JSON.parse(b.legs);blocks.push(`<div class="card"><h2>Your bet · $${b.stake} at ${b.odds}</h2>${l.map(legProg).join("")}</div>`)});
  return blocks.length?`<h3 style="margin-top:0">Your bets in play</h3>${blocks.join("")}`:""}
function togLive(id){if(openLive.has(id))openLive.delete(id);else openLive.add(id);refreshLive()}
function drawLive(){const el=$("#lbody");if(!el)return;
  const liveN=LG.filter(g=>g.state=="in").length;
  el.innerHTML=myHTML()+(LG.length?`<h3 ${myHTML()?"":'style="margin-top:0"'}>${liveN?`${liveN} game${liveN>1?"s":""} live now`:"Games"}</h3>`+LG.map(liveHTML).join(""):'<div class="card empty">No games on the scoreboard right now.</div>')}
async function refreshLive(){if(tab!="live")return;try{LG=await api("live")}catch(e){return}
  const ids=new Set(openLive);[...legs,...myOpen.flatMap(b=>JSON.parse(b.legs))].forEach(l=>ids.add(l.game_id));
  await Promise.all([...ids].filter(id=>LG.some(g=>g.game_id==id&&g.state!="pre")).map(async id=>{try{boxes[id]=await api("live/"+id)}catch(e){}}));
  if(tab=="live")drawLive()}
async function liveTab(a){a.innerHTML=`<div class="note">Scores and stats refresh by themselves every 20 seconds. Tap a game for the box score. ⭐ marks the model's top-3 players.</div><div id="lbody"><p class="mute">Loading…</p></div>`;
  try{const sc=await api("scorecard");myOpen=sc.bets.filter(b=>b.user==localStorage.user&&b.result=="open")}catch(e){myOpen=[]}
  await refreshLive();liveTimer=setInterval(refreshLive,20000)}

/* ---------- lineups ---------- */
let LU=[],luF={q:"",conf:false};
const luChip=t=>/out|ofs/i.test(t)?"out":/ques|doubt|game-time|gtd/i.test(t)?"q":"ok";
const dotc=p=>p==null||p>=100?"var(--good)":p>=50?"var(--gold)":"var(--bad)";
let luOpen={};
const luId=g=>g.away.team+"-"+g.home.team;
function luTog(id){luOpen[id]=!luOpen[id];drawLineups()}
function luAll(open){LU.forEach(g=>luOpen[luId(g)]=open);drawLineups()}
function luSide(sd){
  const row=(p,out)=>`<div class="lp"><span class="pos">${esc(p.pos)}</span>${photo(p.player_id||0,p.name)}<span class="nm2" ${p.player_id?`onclick="go('players','${p.player_id}')"`:""}>${p.top3?"⭐ ":""}${esc(p.name)}${p.new?'<span class="newb">NEW</span>':""}</span>${out?`<span class="stc ${luChip(p.status)}">${esc(p.status)}</span>`:`<span class="dot" style="background:${dotc(p.pct)}" title="${esc(p.note||"")}"></span>`}</div>`;
  return `<div><div class="th"><img src="${logo(sd.team)}" alt="">${nm(sd.team)} <span class="stc ${sd.confirmed?"ok":"ex"}">${sd.confirmed?"Confirmed":"Expected"}</span><span>${esc(sd.record||"")}</span></div>
   ${sd.starters.length?sd.starters.map(p=>row(p,false)).join(""):'<div class="mute" style="padding:8px 0">Lineup not posted yet</div>'}
   ${sd.out.length?`<div class="mnp">May not play</div>`+sd.out.map(p=>row(p,true)).join(""):""}</div>`}
function drawLineups(){const q=luF.q.toLowerCase();
  const hit=g=>[g.away,g.home].some(sd=>(sd.team+" "+nm(sd.team)+" "+sd.starters.concat(sd.out).map(p=>p.name).join(" ")).toLowerCase().includes(q));
  const gs=LU.filter(g=>(!luF.conf||(g.away.confirmed&&g.home.confirmed))&&(!q||hit(g)));
  const last=sd=>sd.starters.map(p=>p.name.split(" ").slice(-1)[0]).join(", ")||"not posted yet";
  const chip=sd=>`<span class="stc ${sd.confirmed?"ok":"ex"}">${sd.team} ${sd.confirmed?"confirmed":"expected"}</span>`;
  $("#lubody").innerHTML=gs.map(g=>{const id=luId(g),open=luOpen[id]||(q&&luOpen[id]!==false);   // a search opens the matching games
    return `<div class="card lg2 ${open?"open":""}" style="padding:0"><div class="lgh" onclick="luTog('${id}')"><img src="${logo(g.away.team)}" alt=""><b>${nm(g.away.team)}</b><span class="mute">at</span><b>${nm(g.home.team)}</b><img src="${logo(g.home.team)}" alt="">
      <span class="mute" style="margin-left:auto">${g.start?timeOf(g.start):esc(g.time)}</span><span class="chv">▾</span></div>
      ${open?`<div class="lu" style="padding:0 14px 12px">${luSide(g.away)}${luSide(g.home)}</div>`:`<div class="lsum2">${chip(g.away)} ${chip(g.home)}<div class="mute" style="margin-top:4px">${nm(g.away.team)}: ${esc(last(g.away))}<br>${nm(g.home.team)}: ${esc(last(g.home))}</div></div>`}</div>`}).join("")||'<div class="card empty">No lineups match.</div>'}
async function lineupsTab(a){a.innerHTML=`<div class="tools"><input id="luq" placeholder="Search team or player" value="${esc(luF.q)}" oninput="luF.q=this.value;drawLineups()"><button class="pill ${luF.conf?"on":""}" onclick="luF.conf=!luF.conf;render()">Confirmed only</button><button class="pill" onclick="luAll(true)">Expand all</button><button class="pill" onclick="luAll(false)">Collapse all</button></div>
   <div class="note">Starting lineups and injury news, without the ads. Dot colour = chance to play (green likely, amber doubtful, red unlikely). <b>NEW</b> = starter who did not start that team's last game. ⭐ = the model's top-3 pick for that team.</div><div id="lubody"><p class="mute">Loading lineups…</p></div>`;
  LU=await api("lineups");drawLineups()}

/* ---------- theme ---------- */
function paintTheme(){const t=document.documentElement.dataset.theme;const b=$("#thm");if(b)b.textContent=t=="dark"?"☀":"☾";const m=$("#tc");if(m)m.content=t=="dark"?"#0e2452":"#0a66b3"}
function toggleTheme(){const t=document.documentElement.dataset.theme=="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.theme=t}catch(e){}paintTheme()}
/* ---------- install as app ---------- */
let deferred=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#inst").style.display="inline-block"});
async function installApp(){if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("#inst").style.display="none"}
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
const ios=/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone;
if(ios&&!localStorage.iosHint){setTimeout(()=>{if(confirm("Tip: to install this as an app, tap the Share button, then “Add to Home Screen”.\n\nShow this tip again?")===false)localStorage.iosHint=1},2500)}

(async()=>{paintTheme();$("#me").textContent=localStorage.user||"";nav();
  if(!localStorage.user){showLogin()}
  try{meta=await api("meta");$("#meta").textContent=`Data to ${meta.data_through}`}catch(e){}
  render()})();
</script>
